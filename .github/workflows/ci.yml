name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test e build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Motore di analisi e interfaccia
        working-directory: core
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - uses: actions/cache@v4
        with:
          path: build/cache-strumenti
          key: strumenti-${{ hashFiles('scripts/strumenti.sh') }}
      - name: Build per Windows
        run: scripts/build-windows.sh
      - name: Licenze di terze parti allineate alle dipendenze incluse
        run: |
          scripts/notices.sh
          git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: Test dell'agente
        working-directory: windows
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test -race ./...
      - uses: actions/upload-artifact@v4
        with:
          name: STARNET-Polaris-windows-amd64
          path: build/STARNET-Polaris/

  windows-smoke:
    name: Collaudo su Windows reale
    needs: test-build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: STARNET-Polaris
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: STARNET-Polaris-windows-amd64
          path: STARNET-Polaris
      - name: Versione e WebView2
        run: |
          ./polaris-cli.exe version
          if ($LASTEXITCODE -ne 0) { throw "version fallito" }
      - name: Rapporto da riga di comando
        run: |
          ./polaris-cli.exe report --quick --verbose
          if ($LASTEXITCODE -ne 0) { throw "report fallito" }
          ./polaris-cli.exe report --quick --json --out scan.json
          # Documento stampabile dallo stesso rapporto (allegato agli artefatti).
          ./polaris-cli.exe report --html --input scan.json --out stato-pc.html
          if ($LASTEXITCODE -ne 0) { throw "documento non creato" }
          $doc = Get-Content stato-pc.html -Raw -Encoding UTF8
          if ($doc -notmatch '<h1>Stato del computer</h1>' -or $doc -notmatch 'Piano d.azione' -or $doc -notmatch 'Note e firma') { throw "documento incompleto" }
          $macs = [regex]::Matches($doc, '\b[0-9a-fA-F]{2}([:-][0-9a-fA-F]{2}){5}\b')
          if ($macs.Count) { throw "indirizzi MAC nel documento: $($macs[0].Value)" }
          "Documento: $([math]::Round((Get-Item stato-pc.html).Length / 1KB)) KB, nessun indirizzo MAC"
          $s = Get-Content scan.json -Raw | ConvertFrom-Json
          "Sistema: $($s.agent.os); amministratore: $($s.agent.elevated)"
          "Schede: " + (($s.adapters | ForEach-Object { "$($_.name) [$($_.kind)] $($_.ipv4 -join ',') gw=$($_.gateways -join ',')" }) -join ' | ')
          "Router: $($s.gateway.ip); ping $($s.gateway.ping.received)/$($s.gateway.ping.sent) via $($s.gateway.ping.method)"
          "Internet: " + (($s.internet.targets | ForEach-Object { "$($_.target) $($_.received)/$($_.sent) $($_.method)" }) -join ' | ')
          "Firewall ($($s.firewall.source)): " + (($s.firewall.profiles | ForEach-Object { "$($_.name)=$($_.enabled) attivo=$($_.active)" }) -join ' | ')
          "Errori: " + (($s.errors | ForEach-Object { "$($_.probe): $($_.message)" }) -join ' | ')
          "Dominio: '$($s.agent.domain)'; suffissi DNS: " + (($s.adapters | ForEach-Object { "$($_.name)='$($_.dnsSuffix)' dhcp=$($_.dhcpServer)" }) -join ' | ')
          if ($s.agent.os -notmatch '^Windows') { throw "sistema non riconosciuto: $($s.agent.os)" }
          if ($s.adapters.Count -lt 1) { throw "GetAdaptersAddresses non ha restituito schede" }
          if (-not $s.gateway.ip) { throw "gateway non individuato" }
          if ($s.firewall.profiles.Count -ne 3) { throw "profili del firewall non letti" }
          if (-not $s.internet.http.Where({ $_.ok })) { throw "verifica HTTPS fallita" }
          # Computer: dati letti in sola lettura da API native e PowerShell.
          $pc = $s.pc
          "Computer: $($pc.os.name) $($pc.os.version) build $($pc.os.build).$($pc.os.ubr) [$($pc.os.edition)]; acceso da $([math]::Round($pc.os.uptimeSec/3600,1)) h; avvio rapido: $($pc.os.fastStartup)"
          "Processore: $($pc.cpu.name) - $($pc.cpu.cores) core / $($pc.cpu.threads) thread; carico $($pc.cpu.loadPct) %"
          "Memoria: $($pc.memory.totalMB) MB, liberi $($pc.memory.availableMB) MB"
          "Dischi: " + (($pc.disks | ForEach-Object { "$($_.id) $($_.name) [$($_.media) $($_.bus)] $($_.sizeGB) GB $($_.health) sistema=$($_.system) smart=$(if ($_.reliability) { $_.reliability | ConvertTo-Json -Compress } else { 'no' })" }) -join ' | ')
          "Volumi: " + (($pc.volumes | ForEach-Object { "$($_.letter) $($_.fs) $($_.freeGB)/$($_.sizeGB) GB disco=$($_.disk)" }) -join ' | ')
          "Eventi in $($pc.eventsDays) giorni: " + (($pc.events | ForEach-Object { "$($_.source) $($_.id) x$($_.count)" }) -join ' | ')
          "Antivirus: " + (($pc.antivirus | ForEach-Object { "$($_.name) attivo=$($_.enabled) aggiornato=$($_.upToDate) ($($_.source))" }) -join ' | ')
          "Aggiornamenti: ultimo $($pc.updates.lastInstalled) $($pc.updates.lastKB); riavvio in sospeso: $($pc.updates.pendingReboot) $($pc.updates.rebootReasons -join ',')"
          "Avvio: $($pc.startup.Count) voci; processi: " + (($pc.processes | Select-Object -First 5 | ForEach-Object { "$($_.name) x$($_.count) $($_.cpuPct)% $($_.memoryMB) MB" }) -join ' | ')
          "Alimentazione: $($pc.power.plan) [$($pc.power.planKind)] AC=$($pc.power.onAC); note: $($pc.notes -join ' / ')"
          if ($pc.os.name -notmatch '^Windows') { throw "sistema del computer non letto" }
          if ($pc.volumes.Count -lt 1) { throw "volumi non letti" }
          if ($pc.disks.Count -lt 1) { throw "dischi fisici non letti (PowerShell)" }
          if (-not $pc.eventsDays) { throw "registro eventi non letto" }
          if ($null -eq $pc.memory.totalMB -or $pc.memory.totalMB -lt 1024) { throw "memoria non letta" }
          # Scheda tecnica (come CPU-Z) e dati SMART letti dal disco.
          $hw = $pc.hardware
          "Scheda tecnica: $($hw.vendor) $($hw.model) [$($hw.chassis)]; scheda madre $($hw.board.vendor) $($hw.board.product); BIOS $($hw.board.biosVersion) $($hw.board.biosDate); firmware $($hw.firmware); Secure Boot $($hw.secureBoot); TPM '$($hw.tpm)'; hypervisor $($hw.hypervisor)"
          "Processore: $($hw.cpu.vendor) famiglia $($hw.cpu.family) modello $($hw.cpu.model) stepping $($hw.cpu.stepping); zoccolo $($hw.cpu.socket); core $($hw.cpu.cores) thread $($hw.cpu.threads) classi $($hw.cpu.coreClasses -join '+'); virtualizzazione $($hw.cpu.virtualization)"
          "Cache: " + (($hw.cpu.caches | ForEach-Object { "L$($_.level) $($_.kind) $($_.count)x$($_.sizeKB) KB" }) -join ' | ') + "; istruzioni: $($hw.cpu.features -join ' ')"
          "Memoria: slot $($hw.memory.slots), max $($hw.memory.maxGB) GB; " + (($hw.memory.modules | ForEach-Object { "$($_.slot) $($_.sizeGB) GB $($_.type) $($_.form) $($_.speedMTs)/$($_.configuredMTs) MT/s" }) -join ' | ')
          "Video: " + (($pc.gpus | ForEach-Object { "$($_.name) $($_.vramMB) MB $($_.width)x$($_.height)@$($_.refreshHz)" }) -join ' | ')
          "SMART: " + (($pc.disks | ForEach-Object { "disco $($_.id): attributi $(if ($_.smart) { @($_.smart).Count } else { 0 }), NVMe $(if ($_.nvme) { $_.nvme | ConvertTo-Json -Compress } else { 'no' })" }) -join ' | ')
          if (-not $hw.cpu.cores -or -not $hw.cpu.caches) { throw "processore della scheda tecnica non letto" }
          if (-not $hw.firmware) { throw "tipo di firmware non letto" }
          if ($null -eq $hw.tpm) { throw "dispositivi di sicurezza non letti (PowerShell)" }
          "Bus nominale (SMBIOS): $($hw.cpu.busMhz) MHz"
          "Defender: $($pc.defender | ConvertTo-Json -Compress)"
          "Minacce: $(if ($null -eq $pc.threats) { 'non lette' } else { "$(@($pc.threats).Count)" })"
      - name: Velocità dei core in tempo reale (contatori di Windows)
        timeout-minutes: 3
        run: |
          $c = @(./polaris-cli.exe clock --seconds 3 --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "clock fallito" }
          foreach ($x in $c) { "Core Speed $($x.mhz) MHz ($($x.perfPct) % della base $($x.baseMhz) MHz); più veloce $($x.maxMhz) MHz; carico $($x.loadPct) %; $($x.cores.Count) processori logici" }
          $last = $c[-1]
          if ($c.Count -ne 3) { throw "attese 3 letture, ottenute $($c.Count)" }
          if (-not $last.mhz -or $last.mhz -le 0 -or -not $last.baseMhz) { throw "frequenza non letta: $($last | ConvertTo-Json -Compress)" }
          if ($last.cores.Count -ne [Environment]::ProcessorCount) { throw "processori logici: $($last.cores.Count) invece di $([Environment]::ProcessorCount)" }
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8742' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $a = Invoke-RestMethod http://127.0.0.1:8742/api/cpu/clock
            Start-Sleep 1
            $b = Invoke-RestMethod http://127.0.0.1:8742/api/cpu/clock
            "API: $($a.mhz) MHz alle $($a.at), poi $($b.mhz) MHz alle $($b.at)"
            if (-not $b.mhz -or $a.at -eq $b.at) { throw "letture via API non aggiornate" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Sensori senza driver (come HWiNFO)
        timeout-minutes: 4
        run: |
          $s = @(./polaris-cli.exe sensors --seconds 3 --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "sensors fallito" }
          if ($s.Count -ne 3) { throw "attese 3 letture, ottenute $($s.Count)" }
          $last = $s[-1]
          foreach ($g in $last.groups) {
            $vals = ($g.sensors | Where-Object { -not $_.detail } | ForEach-Object { "$($_.label) $($_.value) $($_.unit)".Trim() }) -join '; '
            $sub = if ($g.sub) { " ($($g.sub))" } else { '' }
            "$($g.kind.PadRight(8)) $($g.name)${sub}: $vals"
          }
          "Non disponibile su questo PC:"
          $last.missing | ForEach-Object { "  - $_" }
          $kinds = @($last.groups | ForEach-Object { $_.kind })
          foreach ($k in 'cpu', 'memory', 'disk', 'system') { if ($kinds -notcontains $k) { throw "manca il gruppo $k" } }
          $cpu = $last.groups | Where-Object { $_.kind -eq 'cpu' }
          $ids = @($cpu.sensors | ForEach-Object { $_.id })
          foreach ($id in 'cpu.usage', 'cpu.clock', 'cpu.maxclock') { if ($ids -notcontains $id) { throw "manca il sensore $id" } }
          $cores = @($cpu.sensors | Where-Object { $_.id -like 'cpu.core.*.usage' }).Count
          if ($cores -ne [Environment]::ProcessorCount) { throw "processori logici: $cores invece di $([Environment]::ProcessorCount)" }
          $mem = ($last.groups | Where-Object { $_.kind -eq 'memory' }).sensors | Where-Object { $_.id -eq 'mem.load' }
          if (-not $mem -or $mem.value -le 0 -or $mem.value -gt 100) { throw "memoria non letta" }
          $disk = @($last.groups | Where-Object { $_.kind -eq 'disk' -and $_.sub -match [regex]::Escape($env:SystemDrive) })
          if (-not $disk -or -not ($disk[0].sensors | Where-Object { $_.id -like '*.activity' })) { throw "disco di sistema senza attività" }
          if (-not ($last.missing -match 'driver in kernel')) { throw "manca la nota sui sensori che richiedono un driver" }
          ./polaris-cli.exe sensors --seconds 3 --all --csv sensori.csv
          if ($LASTEXITCODE -ne 0) { throw "sensors con il registro CSV fallito" }
          $csv = Get-Content sensori.csv -Encoding UTF8
          if ($csv.Count -ne 4) { throw "righe del CSV: $($csv.Count) invece di 4" }
          if ($csv[0] -notmatch '^\uFEFF?Data e ora;' -or $csv[1] -notmatch '^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d;') { throw "CSV non valido: $($csv[0].Substring(0, [Math]::Min(120, $csv[0].Length)))" }
          "CSV: $(($csv[0] -split ';').Count - 1) colonne, $($csv.Count - 1) letture"
          # Windows senza risorse in inglese: gli insiemi di contatori della versione 2 (Processor Information e altri) si
          # trovano solo con i nomi localizzati. Qui la traduzione si forza anche su questo Windows in inglese.
          $env:POLARIS_PDH_LOCALIZED = '1'
          try {
            $f = @(./polaris-cli.exe sensors --seconds 2 --json | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw "sensors con la traduzione dei nomi forzata fallito" }
            $fcpu = ($f[-1].groups | Where-Object { $_.kind -eq 'cpu' }).sensors
            $fclock = $fcpu | Where-Object { $_.id -eq 'cpu.clock' }
            if (-not $fclock) { throw "con la traduzione dei nomi forzata manca la frequenza (Processor Information)" }
            $k = ./polaris-cli.exe clock --seconds 1 --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $k[0].mhz) { throw "clock con la traduzione dei nomi forzata fallito" }
            "Traduzione dei nomi forzata: $(@($f[-1].groups).Count) gruppi ($((@($f[-1].groups) | ForEach-Object { $_.kind }) -join ', ')), frequenza $($fclock.value) MHz; clock $($k[0].mhz) MHz"
          } finally { Remove-Item Env:POLARIS_PDH_LOCALIZED }
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve', '--port', '8743' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $a = Invoke-RestMethod http://127.0.0.1:8743/api/sensors
            Start-Sleep 1
            $b = Invoke-RestMethod http://127.0.0.1:8743/api/sensors
            "API: $($a.groups.Count) gruppi alle $($a.at), poi $($b.groups.Count) alle $($b.at)"
            if ($a.at -eq $b.at -or $b.groups.Count -lt 3) { throw "letture via API non aggiornate" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Cosa occupa spazio (come WizTree)
        timeout-minutes: 25
        run: |
          # Cartella di Windows: i file di WinSxS e System32 con più nomi (collegamenti fisici) si contano una volta.
          $w = ./polaris-cli.exe space $env:SystemRoot --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "space sulla cartella di Windows fallito" }
          "Windows: $([math]::Round($w.allocBytes / 1e9, 2)) GB in $($w.files) file e $($w.dirs) cartelle, $($w.durationMs) ms; collegamenti fisici contati una volta $([math]::Round($w.linkedBytes / 1e9, 2)) GB; non leggibili $($w.denied)"
          if ($w.files -lt 10000 -or $w.allocBytes -le 0) { throw "cartella di Windows letta male" }
          if ($w.linkedBytes -le 0) { throw "nessun collegamento fisico contato una volta (WinSxS/System32)" }
          if (@($w.hints | ForEach-Object { $_.id }) -notcontains 'winsxs') { throw "manca WinSxS tra le cartelle note" }
          # System32 analizzata da sola contro .NET: Polaris conta una volta i file con più nomi e li attribuisce al nome
          # che viene prima in ordine alfabetico (per esempio in DriverStore), quindi ne vede qualcuno in meno. Solo un
          # controllo di buon senso; i conteggi esatti si provano sotto, su cartelle dal contenuto noto.
          $s = ./polaris-cli.exe space "$env:SystemRoot\System32" --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "space su System32 fallito" }
          $net = [System.IO.Directory]::GetFiles("$env:SystemRoot\System32").Count
          "System32: $($s.tree.ownFiles) file attribuiti da Polaris, $net nomi di file per .NET"
          if ($s.tree.ownFiles -gt $net -or $s.tree.ownFiles -lt $net * 0.98) { throw "conteggio dei file di System32 lontano da quello di .NET" }

          # Cartella dal contenuto noto (NTFS): conteggi esatti, giunzione non seguita, collegamento fisico fuori da
          # Windows contato con entrambi i nomi, nome di un profilo e indirizzo e-mail nascosti.
          $t = if (Test-Path 'D:\') { 'D:\polaris-spazio' } else { "$env:SystemDrive\polaris-spazio" }
          New-Item -ItemType Directory -Force "$t\Users\Giulia\Documenti", "$t\Cartella", "$t\Destinazione" | Out-Null
          1..50 | ForEach-Object { [System.IO.File]::WriteAllBytes("$t\Cartella\file$_.bin", [byte[]]::new(4096 * $_)) }
          [System.IO.File]::WriteAllBytes("$t\Users\Giulia\Documenti\giulia.rossi@studio-prova.it.ost", [byte[]]::new(1048576))
          [System.IO.File]::WriteAllBytes("$t\Destinazione\dentro.bin", [byte[]]::new(8192))
          New-Item -ItemType HardLink -Path "$t\Cartella\collegamento.bin" -Target "$t\Cartella\file50.bin" | Out-Null
          New-Item -ItemType Junction -Path "$t\Giunzione" -Target "$t\Destinazione" | Out-Null
          $kraw = ./polaris-cli.exe space $t --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "space sulla cartella di prova fallito" }
          $k = $kraw | ConvertFrom-Json
          $size = 4096 * 1275 + 1048576 + 8192 + 4096 * 50
          "Cartella di prova: $($k.files) file, $($k.dirs) cartelle, $($k.sizeBytes) byte di dati, $($k.allocBytes) occupati; negate $([int]$k.denied), errori $([int]$k.errors)"
          if ($k.files -ne 53 -or $k.dirs -ne 5 -or $k.sizeBytes -ne $size -or $k.allocBytes -lt $k.sizeBytes -or [int]$k.denied -ne 0 -or [int]$k.errors -ne 0) { throw "cartella di prova letta male (attesi 53 file, 5 cartelle, $size byte)" }
          if ($kraw -match 'Giulia|giulia|rossi|studio-prova') { throw "nome del profilo o indirizzo e-mail nel rapporto" }
          if ($kraw -notmatch 'e-mail[^"\\]*\.ost' -or $kraw -notmatch 'utente 1') { throw "alias del profilo o dell'indirizzo e-mail mancanti" }

          # FAT32 ed exFAT (come le chiavette USB) su dischi virtuali: conteggi uguali a quelli di .NET, nessun errore.
          foreach ($v in @(@('FAT32', 'T'), @('exFAT', 'U'))) {
            $fs, $letter = $v
            $vhd = Join-Path $env:RUNNER_TEMP "prova-$fs.vhdx"
            $dp = Join-Path $env:RUNNER_TEMP "diskpart-$fs.txt"
            @("create vdisk file=`"$vhd`" maximum=100 type=expandable", "select vdisk file=`"$vhd`"", 'attach vdisk', 'convert mbr', 'create partition primary', "format fs=$fs quick label=PROVA", "assign letter=$letter", 'exit') | Set-Content -Encoding ascii $dp
            diskpart /s $dp | Out-Null
            if (-not (Test-Path "${letter}:\")) { "Disco virtuale ${fs} non disponibile su questa macchina: prova saltata"; continue }
            New-Item -ItemType Directory -Force "${letter}:\dati\sotto" | Out-Null
            1..20 | ForEach-Object { [System.IO.File]::WriteAllBytes("${letter}:\dati\f$_.bin", [byte[]]::new(3000 * $_)) }
            [System.IO.File]::WriteAllBytes("${letter}:\dati\sotto\x.bin", [byte[]]::new(5000))
            $j = ./polaris-cli.exe space "${letter}:\dati" --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "space su ${fs} fallito" }
            # Windows può creare System Volume Information alla radice dopo il montaggio: .NET conta prima e dopo.
            $o = [System.IO.EnumerationOptions]::new(); $o.RecurseSubdirectories = $true; $o.IgnoreInaccessible = $true; $o.AttributesToSkip = 0
            $n0 = @([System.IO.Directory]::EnumerateFiles("${letter}:\", '*', $o)).Count
            $r = ./polaris-cli.exe space "${letter}:" --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "space sulla radice di ${fs} fallito" }
            $nf = @([System.IO.Directory]::EnumerateFiles("${letter}:\", '*', $o)).Count
            "${fs}: cartella dati $($j.files) file, $($j.dirs) cartelle, $($j.sizeBytes) byte; radice $($r.files) file ($nf per .NET), file system $($r.fs), errori $([int]$r.errors)"
            if ($j.files -ne 21 -or $j.dirs -ne 1 -or $j.sizeBytes -ne 635000 -or $j.allocBytes -lt $j.sizeBytes -or [int]$j.errors -ne 0) { throw "${fs}: cartella letta male (attesi 21 file, 1 cartella, 635000 byte)" }
            if ($r.fs -ne $fs -or $r.files -lt [math]::Min($n0, $nf) -or $r.files -gt [math]::Max($n0, $nf) -or [int]$r.errors -ne 0) { throw "${fs}: radice letta male" }
          }
          ./polaris-cli.exe space $env:SystemRoot --top 5
          if ($LASTEXITCODE -ne 0) { throw "space in testo fallito" }

          # Unità intera: durata, totali coerenti con lo spazio occupato del volume, niente nome utente nei percorsi.
          $raw = ./polaris-cli.exe space $env:SystemDrive --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "space sull'unità di sistema fallito" }
          $c = $raw | ConvertFrom-Json
          $used = $c.totalBytes - $c.freeBytes
          "Unità $($c.drive) ($($c.fs)): $([math]::Round($c.allocBytes / 1e9, 1)) GB in $($c.files) file e $($c.dirs) cartelle, $([math]::Round($c.durationMs / 1000, 1)) s; occupato sul volume $([math]::Round($used / 1e9, 1)) GB; non leggibili $($c.denied); solo online $($c.cloudFiles)"
          "Cartelle note: $((@($c.hints) | ForEach-Object { "$($_.id) $([math]::Round($_.alloc / 1e9, 2)) GB" }) -join '; ')"
          "File più grandi: $((@($c.topFiles) | Select-Object -First 5 | ForEach-Object { "$($_.path) $([math]::Round($_.alloc / 1e9, 2)) GB" }) -join '; ')"
          if ($c.allocBytes -le 0 -or $c.allocBytes -gt $used * 1.02) { throw "spazio letto incoerente con il volume" }
          if ($c.allocBytes -lt $used * 0.5) { throw "letto meno della metà dello spazio occupato" }
          if ($c.tree.id -ne 1 -or @($c.tree.children).Count -lt 3) { throw "albero delle cartelle mancante" }
          if ($raw -match [regex]::Escape($env:USERNAME)) { throw "nome utente nei percorsi" }
          if ($raw -match 'S-1-5-21-\d+-\d+-\d+-\d+') { throw "SID completo nei percorsi" }
          "Cartelle non lette per errori del disco: $([int]$c.errors)"
          if (@($c.hints | ForEach-Object { $_.id }) -notcontains 'pagefile' -and -not (Test-Path "$env:SystemDrive\pagefile.sys")) { "Nessun file di paging su $env:SystemDrive" }

          # API: analisi di un'altra unità in background, interruzione, apertura solo per numero.
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve', '--port', '8744' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $h = @{ Origin = 'http://127.0.0.1:8744' }
            $drive = if (Test-Path 'D:\') { 'D:' } else { $env:SystemDrive }
            $r = Invoke-RestMethod -Method Post http://127.0.0.1:8744/api/space -Headers $h -ContentType 'application/json' -Body (@{ drive = $drive } | ConvertTo-Json)
            if (-not $r.started) { throw "analisi non avviata" }
            do { Start-Sleep 1; $st = Invoke-RestMethod http://127.0.0.1:8744/api/space } while ($st.running)
            if ($st.error -or -not $st.result -or $st.result.drive -ne $drive) { throw "analisi di $drive via API: $($st.error)" }
            "API: $drive $([math]::Round($st.result.allocBytes / 1e9, 1)) GB in $($st.result.files) file, $($st.result.durationMs) ms"
            try {
              Invoke-RestMethod -Method Post http://127.0.0.1:8744/api/space/open -Headers $h -ContentType 'application/json' -Body (@{ drive = $drive; id = 999999 } | ConvertTo-Json) | Out-Null
              throw "apertura di un elemento sconosciuto accettata"
            } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
            $null = Invoke-RestMethod -Method Post http://127.0.0.1:8744/api/space -Headers $h -ContentType 'application/json' -Body (@{ drive = $env:SystemDrive } | ConvertTo-Json)
            Start-Sleep -Milliseconds 700
            $null = Invoke-RestMethod -Method Delete http://127.0.0.1:8744/api/space -Headers $h
            do { Start-Sleep 1; $st = Invoke-RestMethod http://127.0.0.1:8744/api/space } while ($st.running)
            "Interruzione: $($st.error); parziale=$($st.result.partial), $($st.result.files) file letti"
            if ($st.error -notmatch 'parziali' -or -not $st.result.partial) { throw "interruzione non gestita" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Test di velocità da riga di comando
        run: |
          $c = ./polaris-cli.exe bench cpu --quick --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bench cpu fallito" }
          "Processore: $($c.threads) thread; un thread $($c.singleMBs) MB/s; tutti $($c.multiMBs) MB/s; alla fine $($c.sustainedMBs) MB/s; AC=$($c.onAC)"
          if ($c.singleMBs -le 0 -or $c.multiMBs -le 0) { throw "risultato del processore non valido" }
          $d = ./polaris-cli.exe bench disk --quick --json --drive $env:SystemDrive | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bench disk fallito" }
          "Disco $($d.drive) (file $($d.fileMB) MB), lettura/scrittura in MB/s: SEQ1M Q8T1 $($d.seqQ8ReadMBs)/$($d.seqQ8WriteMBs); SEQ1M Q1T1 $($d.seqReadMBs)/$($d.seqWriteMBs); RND4K Q32T1 $($d.rndQ32ReadMBs)/$($d.rndQ32WriteMBs) ($($d.rndQ32ReadIops)/$($d.rndQ32WriteIops) IOPS); RND4K Q1T1 $($d.rndReadMBs)/$($d.rndWriteMBs) ($($d.rndReadIops)/$($d.rndWriteIops) IOPS) $($d.note)"
          if ($d.seqReadMBs -le 0 -or $d.rndReadIops -le 0) { throw "risultato del disco non valido" }
          if ($d.seqQ8ReadMBs -le 0 -or $d.seqQ8WriteMBs -le 0 -or $d.rndQ32ReadIops -le 0 -or $d.rndQ32WriteIops -le 0) { throw "misure con più richieste in coda non valide" }
          $left = Get-ChildItem -Path $env:TEMP -Filter 'polaris-test-*' -ErrorAction SilentlyContinue
          if ($left) { throw "file di prova non cancellati: $($left.Name -join ', ')" }
      - name: Server locale e API
        run: |
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8737' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $info = Invoke-RestMethod http://127.0.0.1:8737/api/info
            "Agente: $($info.name) $($info.version) su $($info.host)"
            $r = Invoke-WebRequest http://127.0.0.1:8737/api/scan -UseBasicParsing
            if ($r.StatusCode -ne 204) { throw "atteso 204 prima dell'analisi, ottenuto $($r.StatusCode)" }
            Invoke-RestMethod -Method Post http://127.0.0.1:8737/api/scan | Out-Null
            $t = 0
            do { Start-Sleep 1; $t++; $pr = Invoke-RestMethod http://127.0.0.1:8737/api/progress } while ($pr.running -and $t -lt 90)
            ($pr.steps | ForEach-Object { "$($_.state.PadRight(7)) $($_.label)" }) -join "`n"
            $scan = Invoke-RestMethod http://127.0.0.1:8737/api/scan
            if (-not $scan.gateway.ip) { throw "analisi via API senza gateway" }
            $ping = Invoke-RestMethod "http://127.0.0.1:8737/api/ping?target=gateway"
            "Ping singolo verso il router: $($ping.ms) ms"
            # Infrastruttura: nessun inventario senza conferma (nessuna scansione della rete della CI);
            # una sola verifica di raggiungibilità, un ping verso il gateway.
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"authorized":false}' http://127.0.0.1:8737/api/inventory | Out-Null
              throw "inventario accettato senza conferma"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 400) { throw "atteso 400 senza conferma: $($_.Exception.Message)" }
            }
            $body = @{ targets = @(@{ label = 'gateway'; host = $scan.gateway.ip; expect = 'reachable' }) } | ConvertTo-Json -Depth 4
            $reach = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body http://127.0.0.1:8737/api/reach
            "Verifica verso il gateway da $($reach.from): $($reach.results[0].status)"
            if (-not $reach.results[0].status) { throw "verifica senza esito" }
            # Test di velocità via API: conferma obbligatoria per il disco, unità inesistente rifiutata subito.
            foreach ($case in @(@{ body = '{"kind":"disk","drive":"C:"}'; code = 400 }, @{ body = '{"kind":"disk","drive":"Q:","confirm":true}'; code = 422 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.body http://127.0.0.1:8737/api/bench | Out-Null
                throw "accettato: $($case.body)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.body): $($_.Exception.Message)" }
              }
            }
            # Microsoft Defender: azione arbitraria rifiutata; una scansione rapida parte,
            # blocca i test di velocità e si interrompe (la scansione intera è nel passo dopo).
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"action":"format"}' http://127.0.0.1:8737/api/defender | Out-Null
              throw "azione arbitraria accettata"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 400) { throw "atteso 400 per un'azione non valida: $($_.Exception.Message)" }
            }
            $started = $true
            try { Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"action":"quick"}' http://127.0.0.1:8737/api/defender | Out-Null }
            catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 422) { throw "avvio della scansione: $($_.Exception.Message)" }
              "Defender non disponibile su questo runner: $($_.ErrorDetails.Message)"; $started = $false
            }
            if ($started) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"kind":"cpu"}' http://127.0.0.1:8737/api/bench | Out-Null
                # Accettato: lecito solo se la scansione era già finita; si attende la fine del test.
                $busy = Invoke-RestMethod http://127.0.0.1:8737/api/defender
                if ($busy.running) { throw "test di velocità accettato durante la scansione" }
                do { Start-Sleep 1; $b0 = Invoke-RestMethod http://127.0.0.1:8737/api/bench } while ($b0.running)
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 409) { throw "atteso 409 durante la scansione: $($_.Exception.Message)" }
              }
              Invoke-RestMethod -Method Delete http://127.0.0.1:8737/api/defender | Out-Null
              $t = 0
              do { Start-Sleep 1; $t++; $df = Invoke-RestMethod http://127.0.0.1:8737/api/defender } while ($df.running -and $t -lt 60)
              "Scansione interrotta via API: running=$($df.running) errore='$($df.error)' esito='$($df.result.message)'"
              if ($df.running) { throw "la scansione non si è fermata" }
            }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"kind":"cpu"}' http://127.0.0.1:8737/api/bench | Out-Null
            $t = 0
            do { Start-Sleep 1; $t++; $b = Invoke-RestMethod http://127.0.0.1:8737/api/bench } while ($b.running -and $t -lt 90)
            "Test del processore via API: $($b.cpu.singleMBs) / $($b.cpu.multiMBs) / $($b.cpu.sustainedMBs) MB/s in $($b.cpu.durationMs) ms; campioni: $($b.cpu.samples -join ' ')"
            if ($b.error -or -not $b.cpu.multiMBs) { throw "test del processore via API non riuscito: $($b.error)" }
            $html = Invoke-WebRequest http://127.0.0.1:8737/ -UseBasicParsing
            if ($html.Content -notmatch '<title>STARNET Polaris</title>') { throw "interfaccia non servita" }
            if (-not $html.Headers['Content-Security-Policy']) { throw "CSP mancante" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Programmi inclusi (CrystalDiskInfo, CrystalDiskMark, BlueScreenView)
        run: |
          $exes = @{ crystaldiskinfo = 'strumenti/CrystalDiskInfo/DiskInfo64.exe'; crystaldiskmark = 'strumenti/CrystalDiskMark/DiskMark64.exe' }
          foreach ($id in $exes.Keys) {
            $sig = Get-AuthenticodeSignature $exes[$id]
            "$id`: firma $($sig.Status), $($sig.SignerCertificate.Subject -replace ',.*$', '')"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=CrystalMark Inc\.') { throw "firma di $($exes[$id]) non valida" }
          }
          # BlueScreenView si verifica con l'impronta: la sua firma del 2015 usa un certificato scaduto.
          $bsv = Get-AuthenticodeSignature 'strumenti/BlueScreenView/BlueScreenView.exe'
          "bluescreenview: firma $($bsv.Status), $($bsv.SignerCertificate.Subject -replace ',.*$', '') (informativo)"
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8738' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8738/api'
            $t = Invoke-RestMethod "$api/tools"
            "Inclusi: CrystalDiskInfo $($t.bundled.crystaldiskinfo.version), CrystalDiskMark $($t.bundled.crystaldiskmark.version), BlueScreenView $($t.bundled.bluescreenview.version)"
            foreach ($id in @($exes.Keys) + 'bluescreenview') {
              if (-not $t.bundled.$id.version -or $t.bundled.$id.problem) { throw "$id non riconosciuto come copia integra: $($t | ConvertTo-Json -Compress)" }
            }
            # Avvio con un clic (come dall'interfaccia), poi chiusura.
            foreach ($c in @(@{ id = 'crystaldiskmark'; proc = 'DiskMark64' }, @{ id = 'crystaldiskinfo'; proc = 'DiskInfo64' }, @{ id = 'bluescreenview'; proc = 'BlueScreenView' })) {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body "{`"tool`":`"$($c.id)`",`"target`":`"app`"}" -TimeoutSec 30 "$api/open" | Out-Null
              $t0 = 0
              do { Start-Sleep 1; $t0++; $run = Get-Process $c.proc -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 15)
              if (-not $run) { throw "$($c.proc) non avviato" }
              "$($c.proc) avviato da Polaris (PID $($run[0].Id) dalla cartella $(Split-Path $run[0].Path -Parent | Split-Path -Leaf))"
              Stop-Process -Name $c.proc -Force
            }
            # Una copia alterata non si avvia.
            $exe = $exes.crystaldiskmark
            Copy-Item $exe "$exe.orig"
            Add-Content -Path $exe -Value 'x' -NoNewline
            try {
              $t = Invoke-RestMethod "$api/tools"
              if (-not $t.bundled.crystaldiskmark.problem) { throw "copia alterata non segnalata" }
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"crystaldiskmark","target":"app"}' -TimeoutSec 30 "$api/open" | Out-Null
                throw "copia alterata avviata"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 422) { throw "atteso 422 per la copia alterata: $($_.Exception.Message)" }
              }
              if (Get-Process DiskMark64 -ErrorAction SilentlyContinue) { throw "copia alterata in esecuzione" }
              "Copia alterata rifiutata: $($t.bundled.crystaldiskmark.problem)"
            } finally { Move-Item -Force "$exe.orig" $exe }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Versioni portable dal sito ufficiale (Autoruns, CPU-Z)
        timeout-minutes: 8
        run: |
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8739' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8739/api'
            # Programma fuori catalogo o senza versione portable: rifiutato.
            foreach ($case in @(@{ body = '{"tool":"cmd.exe"}'; code = 404 }, @{ body = '{"tool":"crystaldiskinfo"}'; code = 400 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.body "$api/tools/fetch" | Out-Null
                throw "accettato: $($case.body)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.body): $($_.Exception.Message)" }
              }
            }
            foreach ($id in 'autoruns', 'cpu-z') {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body "{`"tool`":`"$id`"}" "$api/tools/fetch" | Out-Null
              $t0 = 0
              do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 180)
              if ($st.fetch.running -or $st.fetch.error) { throw "$id`: download non riuscito: $($st.fetch.error)" }
              $d = $st.portable.$id
              "$id`: scaricato $([math]::Round($st.fetch.done / 1MB, 1)) MB, versione $($d.version), firma di $($d.signer), data $($d.date)"
              if (-not $d.signer -or $d.problem) { throw "$id non verificato: $($st | ConvertTo-Json -Compress -Depth 4)" }
            }
            if ($st.portable.'cpu-z'.signer -ne 'CPUID' -or $st.portable.autoruns.signer -ne 'Microsoft Corporation') { throw "firmatari inattesi" }
            $dir = Join-Path $env:LOCALAPPDATA 'STARNET Polaris\strumenti\autoruns'
            "Cartella: $dir ($((Get-ChildItem $dir).Count) file)"
            # Avvio con la firma verificata di nuovo, poi chiusura.
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns","target":"app"}' -TimeoutSec 60 "$api/open" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $run = Get-Process Autoruns64 -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 20)
            if (-not $run) { throw "Autoruns64 non avviato" }
            "Autoruns64 avviato da Polaris (PID $($run[0].Id))"
            Stop-Process -Name Autoruns64 -Force
            Start-Sleep 1
            # Copia alterata dopo il download: segnalata, non avviata, eliminabile.
            Add-Content -Path (Join-Path $dir 'Autoruns64.exe') -Value 'x' -NoNewline
            $st = Invoke-RestMethod "$api/tools"
            if (-not $st.portable.autoruns.problem) { throw "copia alterata non segnalata" }
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns","target":"app"}' -TimeoutSec 60 "$api/open" | Out-Null
              throw "copia alterata avviata"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 422) { throw "atteso 422 per la copia alterata: $($_.Exception.Message)" }
            }
            if (Get-Process Autoruns64 -ErrorAction SilentlyContinue) { throw "copia alterata in esecuzione" }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns"}' "$api/tools/remove" | Out-Null
            if (Test-Path $dir) { throw "copia non eliminata" }
            "Copia alterata rifiutata ed eliminata: $($st.portable.autoruns.problem)"
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Kit per l'uso senza Internet (Autoruns su un altro profilo, con la rete bloccata)
        timeout-minutes: 8
        run: |
          $kit = Join-Path $PWD 'strumenti-scaricati'
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8740' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8740/api'
            foreach ($case in @(@{ body = '{"tools":["cmd.exe"]}'; code = 404 }, @{ body = '{"tools":[]}'; code = 400 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.body "$api/tools/kit" | Out-Null
                throw "accettato: $($case.body)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.body): $($_.Exception.Message)" }
              }
            }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tools":["autoruns"]}' "$api/tools/kit" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 180)
            if ($st.fetch.running -or $st.fetch.failed -or -not ($st.fetch.ready -contains 'autoruns')) { throw "kit non preparato: $($st.fetch | ConvertTo-Json -Compress -Depth 4)" }
            if (-not (Test-Path (Join-Path $kit 'autoruns\Autoruns64.exe')) -or -not (Test-Path (Join-Path $kit 'LEGGIMI.txt'))) { throw "cartella del kit incompleta" }
            $d = $st.portable.autoruns
            "Kit preparato: $((Get-ChildItem $kit -Recurse -File).Count) file in strumenti-scaricati; Autoruns $($d.version), firma di $($d.signer), nel kit: $($d.kit)"
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }

          # Un altro PC: profilo vuoto (nessuna copia in LOCALAPPDATA) e rete in uscita
          # bloccata dal firewall per Polaris e per la verifica della firma (PowerShell).
          $saved = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'altro-pc'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $fw = @(Get-NetFirewallProfile | Where-Object { $_.Enabled }).Count
          New-NetFirewallRule -DisplayName 'polaris-senza-rete' -Direction Outbound -Action Block -Program (Resolve-Path ./polaris-cli.exe).Path | Out-Null
          New-NetFirewallRule -DisplayName 'polaris-senza-rete-ps' -Direction Outbound -Action Block -Program "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" | Out-Null
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8741' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8741/api'
            ./polaris-cli.exe tools status
            $d = (Invoke-RestMethod "$api/tools").portable.autoruns
            if (-not $d.kit -or $d.problem) { throw "copia del kit non vista dall'altro profilo: $($d | ConvertTo-Json -Compress)" }
            # Senza rete il download non riesce...
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"cpu-z"}' "$api/tools/fetch" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 90)
            if ($fw -gt 0 -and -not $st.fetch.error) { throw "download riuscito con la rete bloccata" }
            "Firewall attivo su $fw profili; download di CPU-Z senza rete: $($st.fetch.error)"
            # ...ma la copia del kit si apre, con la firma verificata di nuovo.
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns","target":"app"}' -TimeoutSec 90 "$api/open" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $run = Get-Process Autoruns64 -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 20)
            if (-not $run) { throw "Autoruns64 dal kit non avviato" }
            "Autoruns64 avviato dal kit senza rete (PID $($run[0].Id))"
            Stop-Process -Name Autoruns64 -Force
          } finally {
            Stop-Process $p -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName 'polaris-senza-rete', 'polaris-senza-rete-ps' -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA = $saved
            Remove-Item -Recurse -Force $kit -ErrorAction SilentlyContinue
          }
      - name: Microsoft Defender da riga di comando (prova non bloccante)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          ./polaris-cli.exe defender status
          $r = ./polaris-cli.exe defender quick --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "scansione rapida non riuscita" }
          "Esito: $($r.message) in $([math]::Round($r.durationMs/1000)) s; minacce nuove: $($r.newThreats)"
      - name: Finestra grafica con WebView2 (prova non bloccante)
        continue-on-error: true
        run: |
          $gui = Start-Process -FilePath ./Polaris.exe -PassThru
          Start-Sleep 30
          $gui.Refresh()
          "Processo attivo: $(-not $gui.HasExited); titolo finestra: '$($gui.MainWindowTitle)'"
          "Processi WebView2: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\finestra.png")
          Stop-Process $gui -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaudo-windows
          path: |
            STARNET-Polaris/scan.json
            STARNET-Polaris/stato-pc.html
            STARNET-Polaris/finestra.png
          if-no-files-found: ignore

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test e build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Motore di analisi e interfaccia
        working-directory: core
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - uses: actions/cache@v4
        with:
          path: build/cache-strumenti
          key: strumenti-${{ hashFiles('scripts/strumenti.sh') }}
      - name: Build per Windows
        run: scripts/build-windows.sh
      - name: Licenze di terze parti allineate alle dipendenze incluse
        run: |
          scripts/notices.sh
          git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: Test dell'agente
        working-directory: windows
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test -race ./...
      - uses: actions/upload-artifact@v4
        with:
          name: STARNET-Polaris-windows-amd64
          path: build/STARNET-Polaris/

  windows-smoke:
    name: Collaudo su Windows reale
    needs: test-build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: STARNET-Polaris
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: STARNET-Polaris-windows-amd64
          path: STARNET-Polaris
      - name: Versione e WebView2
        run: |
          ./polaris-cli.exe version
          if ($LASTEXITCODE -ne 0) { throw "version fallito" }
      - name: Rapporto da riga di comando
        run: |
          ./polaris-cli.exe report --quick --verbose
          if ($LASTEXITCODE -ne 0) { throw "report fallito" }
          ./polaris-cli.exe report --quick --json --out scan.json
          # Documento stampabile dallo stesso rapporto (allegato agli artefatti).
          ./polaris-cli.exe report --html --input scan.json --out stato-pc.html
          if ($LASTEXITCODE -ne 0) { throw "documento non creato" }
          $doc = Get-Content stato-pc.html -Raw -Encoding UTF8
          if ($doc -notmatch '<h1>Stato del computer</h1>' -or $doc -notmatch 'Piano d.azione' -or $doc -notmatch 'Note e firma') { throw "documento incompleto" }
          $macs = [regex]::Matches($doc, '\b[0-9a-fA-F]{2}([:-][0-9a-fA-F]{2}){5}\b')
          if ($macs.Count) { throw "indirizzi MAC nel documento: $($macs[0].Value)" }
          "Documento: $([math]::Round((Get-Item stato-pc.html).Length / 1KB)) KB, nessun indirizzo MAC"
          $s = Get-Content scan.json -Raw | ConvertFrom-Json
          "Sistema: $($s.agent.os); amministratore: $($s.agent.elevated)"
          "Schede: " + (($s.adapters | ForEach-Object { "$($_.name) [$($_.kind)] $($_.ipv4 -join ',') gw=$($_.gateways -join ',')" }) -join ' | ')
          "Router: $($s.gateway.ip); ping $($s.gateway.ping.received)/$($s.gateway.ping.sent) via $($s.gateway.ping.method)"
          "Internet: " + (($s.internet.targets | ForEach-Object { "$($_.target) $($_.received)/$($_.sent) $($_.method)" }) -join ' | ')
          "Firewall ($($s.firewall.source)): " + (($s.firewall.profiles | ForEach-Object { "$($_.name)=$($_.enabled) attivo=$($_.active)" }) -join ' | ')
          "Errori: " + (($s.errors | ForEach-Object { "$($_.probe): $($_.message)" }) -join ' | ')
          "Dominio: '$($s.agent.domain)'; suffissi DNS: " + (($s.adapters | ForEach-Object { "$($_.name)='$($_.dnsSuffix)' dhcp=$($_.dhcpServer)" }) -join ' | ')
          if ($s.agent.os -notmatch '^Windows') { throw "sistema non riconosciuto: $($s.agent.os)" }
          if ($s.adapters.Count -lt 1) { throw "GetAdaptersAddresses non ha restituito schede" }
          if (-not $s.gateway.ip) { throw "gateway non individuato" }
          if ($s.firewall.profiles.Count -ne 3) { throw "profili del firewall non letti" }
          if (-not $s.internet.http.Where({ $_.ok })) { throw "verifica HTTPS fallita" }
          # Computer: dati letti in sola lettura da API native e PowerShell.
          $pc = $s.pc
          "Computer: $($pc.os.name) $($pc.os.version) build $($pc.os.build).$($pc.os.ubr) [$($pc.os.edition)]; acceso da $([math]::Round($pc.os.uptimeSec/3600,1)) h; avvio rapido: $($pc.os.fastStartup)"
          "Processore: $($pc.cpu.name) - $($pc.cpu.cores) core / $($pc.cpu.threads) thread; carico $($pc.cpu.loadPct) %"
          "Memoria: $($pc.memory.totalMB) MB, liberi $($pc.memory.availableMB) MB"
          "Dischi: " + (($pc.disks | ForEach-Object { "$($_.id) $($_.name) [$($_.media) $($_.bus)] $($_.sizeGB) GB $($_.health) sistema=$($_.system) smart=$(if ($_.reliability) { $_.reliability | ConvertTo-Json -Compress } else { 'no' })" }) -join ' | ')
          "Volumi: " + (($pc.volumes | ForEach-Object { "$($_.letter) $($_.fs) $($_.freeGB)/$($_.sizeGB) GB disco=$($_.disk)" }) -join ' | ')
          "Eventi in $($pc.eventsDays) giorni: " + (($pc.events | ForEach-Object { "$($_.source) $($_.id) x$($_.count)" }) -join ' | ')
          "Antivirus: " + (($pc.antivirus | ForEach-Object { "$($_.name) attivo=$($_.enabled) aggiornato=$($_.upToDate) ($($_.source))" }) -join ' | ')
          "Aggiornamenti: ultimo $($pc.updates.lastInstalled) $($pc.updates.lastKB); riavvio in sospeso: $($pc.updates.pendingReboot) $($pc.updates.rebootReasons -join ',')"
          "Avvio: $($pc.startup.Count) voci; processi: " + (($pc.processes | Select-Object -First 5 | ForEach-Object { "$($_.name) x$($_.count) $($_.cpuPct)% $($_.memoryMB) MB" }) -join ' | ')
          "Alimentazione: $($pc.power.plan) [$($pc.power.planKind)] AC=$($pc.power.onAC); note: $($pc.notes -join ' / ')"
          if ($pc.os.name -notmatch '^Windows') { throw "sistema del computer non letto" }
          if ($pc.volumes.Count -lt 1) { throw "volumi non letti" }
          if ($pc.disks.Count -lt 1) { throw "dischi fisici non letti (PowerShell)" }
          if (-not $pc.eventsDays) { throw "registro eventi non letto" }
          if ($null -eq $pc.memory.totalMB -or $pc.memory.totalMB -lt 1024) { throw "memoria non letta" }
          # Scheda tecnica (come CPU-Z) e dati SMART letti dal disco.
          $hw = $pc.hardware
          "Scheda tecnica: $($hw.vendor) $($hw.model) [$($hw.chassis)]; scheda madre $($hw.board.vendor) $($hw.board.product); BIOS $($hw.board.biosVersion) $($hw.board.biosDate); firmware $($hw.firmware); Secure Boot $($hw.secureBoot); TPM '$($hw.tpm)'; hypervisor $($hw.hypervisor)"
          "Processore: $($hw.cpu.vendor) famiglia $($hw.cpu.family) modello $($hw.cpu.model) stepping $($hw.cpu.stepping); zoccolo $($hw.cpu.socket); core $($hw.cpu.cores) thread $($hw.cpu.threads) classi $($hw.cpu.coreClasses -join '+'); virtualizzazione $($hw.cpu.virtualization)"
          "Cache: " + (($hw.cpu.caches | ForEach-Object { "L$($_.level) $($_.kind) $($_.count)x$($_.sizeKB) KB" }) -join ' | ') + "; istruzioni: $($hw.cpu.features -join ' ')"
          "Memoria: slot $($hw.memory.slots), max $($hw.memory.maxGB) GB; " + (($hw.memory.modules | ForEach-Object { "$($_.slot) $($_.sizeGB) GB $($_.type) $($_.form) $($_.speedMTs)/$($_.configuredMTs) MT/s" }) -join ' | ')
          "Video: " + (($pc.gpus | ForEach-Object { "$($_.name) $($_.vramMB) MB $($_.width)x$($_.height)@$($_.refreshHz)" }) -join ' | ')
          "SMART: " + (($pc.disks | ForEach-Object { "disco $($_.id): attributi $(if ($_.smart) { @($_.smart).Count } else { 0 }), NVMe $(if ($_.nvme) { $_.nvme | ConvertTo-Json -Compress } else { 'no' })" }) -join ' | ')
          if (-not $hw.cpu.cores -or -not $hw.cpu.caches) { throw "processore della scheda tecnica non letto" }
          if (-not $hw.firmware) { throw "tipo di firmware non letto" }
          if ($null -eq $hw.tpm) { throw "dispositivi di sicurezza non letti (PowerShell)" }
          "Bus nominale (SMBIOS): $($hw.cpu.busMhz) MHz"
          # Dispositivi e driver (come Gestione dispositivi), letti con SetupAPI.
          $dv = $pc.devices
          "Dispositivi: $($dv.total) presenti, $($dv.problems) con problemi; classi: " + (($dv.classes | Select-Object -First 12 | ForEach-Object { "$($_.class)=$($_.count)" }) -join ' ')
          "Firma dei driver: $($dv.codeIntegrity | ConvertTo-Json -Compress)"
          "Con problemi o driver di terze parti: " + (($dv.items | Select-Object -First 15 | ForEach-Object { "$($_.name) [$($_.class) $($_.enumerator) $($_.hardwareId)] codice=$($_.problem) $($_.problemStatus) driver=$($_.driver.provider) $($_.driver.version) $($_.driver.date) $($_.driver.inf) $($_.driver.file)" }) -join ' | ')
          if (-not $dv -or $dv.total -lt 10) { throw "dispositivi non letti" }
          if (-not $dv.codeIntegrity) { throw "integrità del codice non letta" }
          if (-not ($dv.classes | Where-Object { $_.class -eq 'DiskDrive' })) { throw "classi dei dispositivi non lette (DEVPKEY_Device_Class)" }
          $ids = @($dv.items | Where-Object { $_.hardwareId -match '\\' })
          if ($dv.items.Count -and -not $ids.Count) { throw "hardware ID non letti" }
          if ($s | ConvertTo-Json -Depth 20 | Select-String -Pattern '\\[0-9A-F]&[0-9A-F]{6,}&' -Quiet) { throw "identificativi d'istanza nel rapporto" }
          # Avvio, programmi che si chiudono da soli e indice di stabilità (registri eventi nativi e WMI).
          $bt = $pc.boot
          "Avvio: registro $($bt.channel), $(@($bt.boots).Count) avvii misurati, firmware $($bt.firmwareMs) ms; ultimi: " + ((@($bt.boots) | Select-Object -First 3 | ForEach-Object { "$($_.time) $($_.totalMs) ms (desktop $($_.mainPathMs), dopo $($_.postBootMs))" }) -join ' | ')
          "Componenti lenti: " + ((@($bt.slow) | Select-Object -First 5 | ForEach-Object { "$($_.phase)/$($_.kind) $($_.name) x$($_.count) +$($_.degradationMs) ms" }) -join ' | ') + "; spegnimenti: $(if ($bt.shutdowns) { @($bt.shutdowns).Count } else { 0 })"
          $ap = $pc.apps
          "Programmi: registro $($ap.channel), $($ap.crashes) arresti, $($ap.hangs) blocchi; " + ((@($ap.apps) | Select-Object -First 5 | ForEach-Object { "$($_.app) $($_.crashes)/$($_.hangs)" }) -join ' | ') + "; rapporti: " + ((@($ap.reports) | ForEach-Object { "$($_.event) x$($_.count)" }) -join ' ') + "; WER $($ap.wer | ConvertTo-Json -Compress)"
          $rl = $pc.reliability
          "Affidabilità: disponibile $($rl.available), indice $($rl.index) del $($rl.indexAt), motivo '$($rl.reason)', WMIEnable '$($rl.wmiEnabled)', $(@($rl.series).Count) giorni, record: " + ((@($rl.records) | Select-Object -First 6 | ForEach-Object { "$($_.category) $($_.source) $($_.id) x$($_.count)" }) -join ' | ')
          if (-not $bt -or $bt.channel -eq 'error') { throw "registro Diagnostics-Performance non letto" }
          if (-not $ap -or $ap.channel -ne 'ok') { throw "registro Applicazione non letto" }
          if (-not $rl) { throw "indice di stabilità non letto (PowerShell)" }
          # Aggiornamenti (API di Windows Update Agent), Diagnostica memoria, file system.
          $up = $pc.updates
          "Windows Update: cronologia $(if ($null -eq $up.history) { "non letta ($($up.historyError))" } else { "$(@($up.history).Count) voci" }); ultima installazione $($up.lastSuccess), ultima ricerca $($up.lastSearch); servizio $($up.service | ConvertTo-Json -Compress); criteri $($up.policy | ConvertTo-Json -Compress)"
          "Ultime voci: " + ((@($up.history) | Select-Object -First 4 | ForEach-Object { "$($_.date) [$($_.kind)/$($_.result)] $($_.kb) $($_.hresult)" }) -join ' | ')
          "Diagnostica memoria: $($pc.memDiag | ConvertTo-Json -Compress)"
          "Volumi: " + ((@($pc.volumes) | ForEach-Object { "$($_.letter) dirty=$($_.dirty) stato=$($_.health)" }) -join ' | ') + "; controlli all'avvio: $(@($pc.fsChecks).Count)"
          if ($null -eq $up.history) { throw "cronologia di Windows Update non letta: $($up.historyError)" }
          if (-not $up.service.wu) { throw "servizio Windows Update non letto" }
          if (-not (@($pc.volumes) | Where-Object { $null -ne $_.dirty })) { throw "stato da controllare dei volumi non letto (FSCTL_IS_VOLUME_DIRTY)" }
          if (-not (@($pc.volumes) | Where-Object { $_.health })) { throw "stato del file system dei volumi non letto (MSFT_Volume)" }
          if ($null -eq $pc.memDiag) { throw "registro di sistema per Diagnostica memoria non letto" }
          # Cifratura, punti di ripristino, backup, account (senza nomi), accessi, stampanti.
          $raw = Get-Content scan.json -Raw
          "Cifratura: $($pc.encryption | ConvertTo-Json -Compress -Depth 4)"
          "Backup: $($pc.backup | ConvertTo-Json -Compress -Depth 4)"
          "Account: $(@($pc.accounts.local).Count) locali; amministratori $($pc.accounts.admins | ConvertTo-Json -Compress); in uso amministratore: $($pc.accounts.currentIsAdmin)"
          "Accessi: $($pc.access | ConvertTo-Json -Compress -Depth 4)"
          "Stampa: spooler $($pc.printing.spooler | ConvertTo-Json -Compress); " + ((@($pc.printing.printers) | ForEach-Object { "$($_.name) [$($_.kind)] $($_.flags -join ',') lavori $($_.jobs)" }) -join ' | ')
          if (-not $pc.encryption) { throw "stato della cifratura non letto" }
          if (-not $pc.accounts -or -not @($pc.accounts.local).Count) { throw "account locali non letti" }
          if (-not $pc.access.uac) { throw "Controllo dell'account utente non letto" }
          if (-not $pc.printing.spooler) { throw "servizio di stampa non letto" }
          # Albero USB (come UsbTreeView): le macchine della CI sono virtuali e
          # di solito senza controller USB ("none"); mai identificativi di istanza.
          "USB: $($pc.usb.read), $(@($pc.usb.controllers).Count) controller: " + ((@($pc.usb.controllers) | ForEach-Object { "$($_.name) [$($_.kind)] porte $($_.hub.portCount)" }) -join ' | ')
          if (-not $pc.usb -or $pc.usb.read -eq 'error' -or $pc.usb.partial) { throw "albero USB non letto: $($pc.usb | ConvertTo-Json -Compress)" }
          if (($pc.usb | ConvertTo-Json -Depth 20) -match '(USB|USBSTOR|PCI)\\\\(VID|VEN|DISK|ROOT_HUB)') { throw "identificativo di istanza nell'albero USB" }
          if ($raw -match '"(name|userName|fullName)"\s*:\s*"[^"]*(runneradmin|Administrator)[^"]*"') { throw "nome di account nel rapporto" }
          # Nessun percorso della cartella dell'utente nel rapporto (solo %USERPROFILE%).
          $raw = Get-Content scan.json -Raw
          $leak = [regex]::Match($raw, '.{0,60}' + [regex]::Escape($env:USERPROFILE.Replace('\', '\\')) + '.{0,40}', 'IgnoreCase')
          if ($leak.Success) { throw "cartella dell'utente nel rapporto: $($leak.Value)" }
          "Defender: $($pc.defender | ConvertTo-Json -Compress)"
          "Minacce: $(if ($null -eq $pc.threats) { 'non lette' } else { "$(@($pc.threats).Count)" })"
      - name: Velocità dei core in tempo reale (contatori di Windows)
        timeout-minutes: 3
        run: |
          $c = @(./polaris-cli.exe clock --seconds 3 --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "clock fallito" }
          foreach ($x in $c) { "Core Speed $($x.mhz) MHz ($($x.perfPct) % della base $($x.baseMhz) MHz); più veloce $($x.maxMhz) MHz; carico $($x.loadPct) %; $($x.cores.Count) processori logici" }
          $last = $c[-1]
          if ($c.Count -ne 3) { throw "attese 3 letture, ottenute $($c.Count)" }
          if (-not $last.mhz -or $last.mhz -le 0 -or -not $last.baseMhz) { throw "frequenza non letta: $($last | ConvertTo-Json -Compress)" }
          if ($last.cores.Count -ne [Environment]::ProcessorCount) { throw "processori logici: $($last.cores.Count) invece di $([Environment]::ProcessorCount)" }
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8742' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $a = Invoke-RestMethod http://127.0.0.1:8742/api/cpu/clock
            Start-Sleep 1
            $b = Invoke-RestMethod http://127.0.0.1:8742/api/cpu/clock
            "API: $($a.mhz) MHz alle $($a.at), poi $($b.mhz) MHz alle $($b.at)"
            if (-not $b.mhz -or $a.at -eq $b.at) { throw "letture via API non aggiornate" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Sensori senza driver (come HWiNFO)
        timeout-minutes: 4
        run: |
          $s = @(./polaris-cli.exe sensors --seconds 3 --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "sensors fallito" }
          if ($s.Count -ne 3) { throw "attese 3 letture, ottenute $($s.Count)" }
          $last = $s[-1]
          foreach ($g in $last.groups) {
            $vals = ($g.sensors | Where-Object { -not $_.detail } | ForEach-Object { "$($_.label) $($_.value) $($_.unit)".Trim() }) -join '; '
            $sub = if ($g.sub) { " ($($g.sub))" } else { '' }
            "$($g.kind.PadRight(8)) $($g.name)${sub}: $vals"
          }
          "Non disponibile su questo PC:"
          $last.missing | ForEach-Object { "  - $_" }
          $kinds = @($last.groups | ForEach-Object { $_.kind })
          foreach ($k in 'cpu', 'memory', 'disk', 'system') { if ($kinds -notcontains $k) { throw "manca il gruppo $k" } }
          $cpu = $last.groups | Where-Object { $_.kind -eq 'cpu' }
          $ids = @($cpu.sensors | ForEach-Object { $_.id })
          foreach ($id in 'cpu.usage', 'cpu.clock', 'cpu.maxclock') { if ($ids -notcontains $id) { throw "manca il sensore $id" } }
          $cores = @($cpu.sensors | Where-Object { $_.id -like 'cpu.core.*.usage' }).Count
          if ($cores -ne [Environment]::ProcessorCount) { throw "processori logici: $cores invece di $([Environment]::ProcessorCount)" }
          $mem = ($last.groups | Where-Object { $_.kind -eq 'memory' }).sensors | Where-Object { $_.id -eq 'mem.load' }
          if (-not $mem -or $mem.value -le 0 -or $mem.value -gt 100) { throw "memoria non letta" }
          $disk = @($last.groups | Where-Object { $_.kind -eq 'disk' -and $_.sub -match [regex]::Escape($env:SystemDrive) })
          if (-not $disk -or -not ($disk[0].sensors | Where-Object { $_.id -like '*.activity' })) { throw "disco di sistema senza attività" }
          if (-not ($last.missing -match 'driver in kernel')) { throw "manca la nota sui sensori che richiedono un driver" }
          ./polaris-cli.exe sensors --seconds 3 --all --csv sensori.csv
          if ($LASTEXITCODE -ne 0) { throw "sensors con il registro CSV fallito" }
          $csv = Get-Content sensori.csv -Encoding UTF8
          if ($csv.Count -ne 4) { throw "righe del CSV: $($csv.Count) invece di 4" }
          if ($csv[0] -notmatch '^\uFEFF?Data e ora;' -or $csv[1] -notmatch '^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d;') { throw "CSV non valido: $($csv[0].Substring(0, [Math]::Min(120, $csv[0].Length)))" }
          "CSV: $(($csv[0] -split ';').Count - 1) colonne, $($csv.Count - 1) letture"
          # Windows senza risorse in inglese: gli insiemi di contatori della versione 2 (Processor Information e altri) si
          # trovano solo con i nomi localizzati. Qui la traduzione si forza anche su questo Windows in inglese.
          $env:POLARIS_PDH_LOCALIZED = '1'
          try {
            $f = @(./polaris-cli.exe sensors --seconds 2 --json | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw "sensors con la traduzione dei nomi forzata fallito" }
            $fcpu = ($f[-1].groups | Where-Object { $_.kind -eq 'cpu' }).sensors
            $fclock = $fcpu | Where-Object { $_.id -eq 'cpu.clock' }
            if (-not $fclock) { throw "con la traduzione dei nomi forzata manca la frequenza (Processor Information)" }
            $k = ./polaris-cli.exe clock --seconds 1 --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $k[0].mhz) { throw "clock con la traduzione dei nomi forzata fallito" }
            "Traduzione dei nomi forzata: $(@($f[-1].groups).Count) gruppi ($((@($f[-1].groups) | ForEach-Object { $_.kind }) -join ', ')), frequenza $($fclock.value) MHz; clock $($k[0].mhz) MHz"
          } finally { Remove-Item Env:POLARIS_PDH_LOCALIZED }
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve', '--port', '8743' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $a = Invoke-RestMethod http://127.0.0.1:8743/api/sensors
            Start-Sleep 1
            $b = Invoke-RestMethod http://127.0.0.1:8743/api/sensors
            "API: $($a.groups.Count) gruppi alle $($a.at), poi $($b.groups.Count) alle $($b.at)"
            if ($a.at -eq $b.at -or $b.groups.Count -lt 3) { throw "letture via API non aggiornate" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Cosa occupa spazio (come WizTree)
        # L'unità intera ha 1,15 milioni di file: di solito 7-9 minuti, ma il disco delle macchine virtuali
        # a volte è molto più lento (run 45: la sola cartella di Windows in 198 s invece di 51-64).
        timeout-minutes: 45
        run: |
          # Cartella di Windows: i file di WinSxS e System32 con più nomi (collegamenti fisici) si contano una volta.
          $w = ./polaris-cli.exe space $env:SystemRoot --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "space sulla cartella di Windows fallito" }
          "Windows: $([math]::Round($w.allocBytes / 1e9, 2)) GB in $($w.files) file e $($w.dirs) cartelle, $($w.durationMs) ms; collegamenti fisici contati una volta $([math]::Round($w.linkedBytes / 1e9, 2)) GB; non leggibili $($w.denied)"
          if ($w.files -lt 10000 -or $w.allocBytes -le 0) { throw "cartella di Windows letta male" }
          if ($w.linkedBytes -le 0) { throw "nessun collegamento fisico contato una volta (WinSxS/System32)" }
          if (@($w.hints | ForEach-Object { $_.id }) -notcontains 'winsxs') { throw "manca WinSxS tra le cartelle note" }
          # System32 analizzata da sola contro .NET: Polaris conta una volta i file con più nomi e li attribuisce al nome
          # che viene prima in ordine alfabetico (per esempio in DriverStore), quindi ne vede qualcuno in meno. Solo un
          # controllo di buon senso; i conteggi esatti si provano sotto, su cartelle dal contenuto noto.
          $s = ./polaris-cli.exe space "$env:SystemRoot\System32" --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "space su System32 fallito" }
          $net = [System.IO.Directory]::GetFiles("$env:SystemRoot\System32").Count
          "System32: $($s.tree.ownFiles) file attribuiti da Polaris, $net nomi di file per .NET"
          if ($s.tree.ownFiles -gt $net -or $s.tree.ownFiles -lt $net * 0.98) { throw "conteggio dei file di System32 lontano da quello di .NET" }

          # Cartella dal contenuto noto (NTFS): conteggi esatti, giunzione non seguita, collegamento fisico fuori da
          # Windows contato con entrambi i nomi, nome di un profilo e indirizzo e-mail nascosti.
          $t = if (Test-Path 'D:\') { 'D:\polaris-spazio' } else { "$env:SystemDrive\polaris-spazio" }
          New-Item -ItemType Directory -Force "$t\Users\Giulia\Documenti", "$t\Cartella", "$t\Destinazione" | Out-Null
          1..50 | ForEach-Object { [System.IO.File]::WriteAllBytes("$t\Cartella\file$_.bin", [byte[]]::new(4096 * $_)) }
          [System.IO.File]::WriteAllBytes("$t\Users\Giulia\Documenti\giulia.rossi@studio-prova.it.ost", [byte[]]::new(1048576))
          [System.IO.File]::WriteAllBytes("$t\Destinazione\dentro.bin", [byte[]]::new(8192))
          New-Item -ItemType HardLink -Path "$t\Cartella\collegamento.bin" -Target "$t\Cartella\file50.bin" | Out-Null
          New-Item -ItemType Junction -Path "$t\Giunzione" -Target "$t\Destinazione" | Out-Null
          $kraw = ./polaris-cli.exe space $t --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "space sulla cartella di prova fallito" }
          $k = $kraw | ConvertFrom-Json
          $size = 4096 * 1275 + 1048576 + 8192 + 4096 * 50
          "Cartella di prova: $($k.files) file, $($k.dirs) cartelle, $($k.sizeBytes) byte di dati, $($k.allocBytes) occupati; negate $([int]$k.denied), errori $([int]$k.errors)"
          if ($k.files -ne 53 -or $k.dirs -ne 5 -or $k.sizeBytes -ne $size -or $k.allocBytes -lt $k.sizeBytes -or [int]$k.denied -ne 0 -or [int]$k.errors -ne 0) { throw "cartella di prova letta male (attesi 53 file, 5 cartelle, $size byte)" }
          if ($kraw -match 'Giulia|giulia|rossi|studio-prova') { throw "nome del profilo o indirizzo e-mail nel rapporto" }
          if ($kraw -notmatch 'e-mail[^"\\]*\.ost' -or $kraw -notmatch 'utente 1') { throw "alias del profilo o dell'indirizzo e-mail mancanti" }

          # FAT32 ed exFAT (come le chiavette USB) su dischi virtuali: conteggi uguali a quelli di .NET, nessun errore.
          foreach ($v in @(@('FAT32', 'T'), @('exFAT', 'U'))) {
            $fs, $letter = $v
            $vhd = Join-Path $env:RUNNER_TEMP "prova-$fs.vhdx"
            $dp = Join-Path $env:RUNNER_TEMP "diskpart-$fs.txt"
            @("create vdisk file=`"$vhd`" maximum=100 type=expandable", "select vdisk file=`"$vhd`"", 'attach vdisk', 'convert mbr', 'create partition primary', "format fs=$fs quick label=PROVA", "assign letter=$letter", 'exit') | Set-Content -Encoding ascii $dp
            diskpart /s $dp | Out-Null
            if (-not (Test-Path "${letter}:\")) { "Disco virtuale ${fs} non disponibile su questa macchina: prova saltata"; continue }
            New-Item -ItemType Directory -Force "${letter}:\dati\sotto" | Out-Null
            1..20 | ForEach-Object { [System.IO.File]::WriteAllBytes("${letter}:\dati\f$_.bin", [byte[]]::new(3000 * $_)) }
            [System.IO.File]::WriteAllBytes("${letter}:\dati\sotto\x.bin", [byte[]]::new(5000))
            $j = ./polaris-cli.exe space "${letter}:\dati" --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "space su ${fs} fallito" }
            # Windows può creare System Volume Information alla radice dopo il montaggio: .NET conta prima e dopo.
            $o = [System.IO.EnumerationOptions]::new(); $o.RecurseSubdirectories = $true; $o.IgnoreInaccessible = $true; $o.AttributesToSkip = 0
            $n0 = @([System.IO.Directory]::EnumerateFiles("${letter}:\", '*', $o)).Count
            $r = ./polaris-cli.exe space "${letter}:" --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "space sulla radice di ${fs} fallito" }
            $nf = @([System.IO.Directory]::EnumerateFiles("${letter}:\", '*', $o)).Count
            "${fs}: cartella dati $($j.files) file, $($j.dirs) cartelle, $($j.sizeBytes) byte; radice $($r.files) file ($nf per .NET), file system $($r.fs), errori $([int]$r.errors)"
            if ($j.files -ne 21 -or $j.dirs -ne 1 -or $j.sizeBytes -ne 635000 -or $j.allocBytes -lt $j.sizeBytes -or [int]$j.errors -ne 0) { throw "${fs}: cartella letta male (attesi 21 file, 1 cartella, 635000 byte)" }
            if ($r.fs -ne $fs -or $r.files -lt [math]::Min($n0, $nf) -or $r.files -gt [math]::Max($n0, $nf) -or [int]$r.errors -ne 0) { throw "${fs}: radice letta male" }
          }
          ./polaris-cli.exe space $env:SystemRoot --top 5
          if ($LASTEXITCODE -ne 0) { throw "space in testo fallito" }

          # Unità intera: durata, totali coerenti con lo spazio occupato del volume, niente nome utente nei percorsi.
          $raw = ./polaris-cli.exe space $env:SystemDrive --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "space sull'unità di sistema fallito" }
          $c = $raw | ConvertFrom-Json
          $used = $c.totalBytes - $c.freeBytes
          "Unità $($c.drive) ($($c.fs)): $([math]::Round($c.allocBytes / 1e9, 1)) GB in $($c.files) file e $($c.dirs) cartelle, $([math]::Round($c.durationMs / 1000, 1)) s; occupato sul volume $([math]::Round($used / 1e9, 1)) GB; non leggibili $($c.denied); solo online $($c.cloudFiles)"
          "Cartelle note: $((@($c.hints) | ForEach-Object { "$($_.id) $([math]::Round($_.alloc / 1e9, 2)) GB" }) -join '; ')"
          "File più grandi: $((@($c.topFiles) | Select-Object -First 5 | ForEach-Object { "$($_.path) $([math]::Round($_.alloc / 1e9, 2)) GB" }) -join '; ')"
          if ($c.allocBytes -le 0 -or $c.allocBytes -gt $used * 1.02) { throw "spazio letto incoerente con il volume" }
          if ($c.allocBytes -lt $used * 0.5) { throw "letto meno della metà dello spazio occupato" }
          if ($c.tree.id -ne 1 -or @($c.tree.children).Count -lt 3) { throw "albero delle cartelle mancante" }
          if ($raw -match [regex]::Escape($env:USERNAME)) { throw "nome utente nei percorsi" }
          if ($raw -match 'S-1-5-21-\d+-\d+-\d+-\d+') { throw "SID completo nei percorsi" }
          "Cartelle non lette per errori del disco: $([int]$c.errors)"
          if (@($c.hints | ForEach-Object { $_.id }) -notcontains 'pagefile' -and -not (Test-Path "$env:SystemDrive\pagefile.sys")) { "Nessun file di paging su $env:SystemDrive" }

          # API: analisi di un'altra unità in background, interruzione, apertura solo per numero.
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve', '--port', '8744' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $h = @{ Origin = 'http://127.0.0.1:8744' }
            $drive = if (Test-Path 'D:\') { 'D:' } else { $env:SystemDrive }
            $r = Invoke-RestMethod -Method Post http://127.0.0.1:8744/api/space -Headers $h -ContentType 'application/json' -Body (@{ drive = $drive } | ConvertTo-Json)
            if (-not $r.started) { throw "analisi non avviata" }
            do { Start-Sleep 1; $st = Invoke-RestMethod http://127.0.0.1:8744/api/space } while ($st.running)
            if ($st.error -or -not $st.result -or $st.result.drive -ne $drive) { throw "analisi di $drive via API: $($st.error)" }
            "API: $drive $([math]::Round($st.result.allocBytes / 1e9, 1)) GB in $($st.result.files) file, $($st.result.durationMs) ms"
            try {
              Invoke-RestMethod -Method Post http://127.0.0.1:8744/api/space/open -Headers $h -ContentType 'application/json' -Body (@{ drive = $drive; id = 999999 } | ConvertTo-Json) | Out-Null
              throw "apertura di un elemento sconosciuto accettata"
            } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
            $null = Invoke-RestMethod -Method Post http://127.0.0.1:8744/api/space -Headers $h -ContentType 'application/json' -Body (@{ drive = $env:SystemDrive } | ConvertTo-Json)
            Start-Sleep -Milliseconds 700
            $null = Invoke-RestMethod -Method Delete http://127.0.0.1:8744/api/space -Headers $h
            do { Start-Sleep 1; $st = Invoke-RestMethod http://127.0.0.1:8744/api/space } while ($st.running)
            "Interruzione: $($st.error); parziale=$($st.result.partial), $($st.result.files) file letti"
            if ($st.error -notmatch 'parziali' -or -not $st.result.partial) { throw "interruzione non gestita" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Certificati dei servizi interni
        timeout-minutes: 6
        run: |
          # Servizio HTTPS locale con un certificato autofirmato (openssl di Git per Windows, server di Python).
          $openssl = @('C:\Program Files\Git\usr\bin\openssl.exe', 'C:\Program Files\Git\mingw64\bin\openssl.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $openssl) { throw "openssl di Git per Windows non trovato" }
          $d = Join-Path $env:RUNNER_TEMP 'certs'
          New-Item -ItemType Directory -Force $d | Out-Null
          & $openssl req -x509 -newkey rsa:2048 -sha256 -nodes -keyout "$d\k.pem" -out "$d\c.pem" -days 20 -subj '/CN=servizio-prova' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' 2>&1 | Out-Null
          if (-not (Test-Path "$d\c.pem")) { throw "certificato di prova non creato" }
          & $openssl x509 -in "$d\c.pem" -outform der -out "$d\c.cer" 2>&1 | Out-Null
          @(
            'import http.server, ssl, sys',
            "s = http.server.HTTPServer(('127.0.0.1', 8445), http.server.SimpleHTTPRequestHandler)",
            'c = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)',
            'c.load_cert_chain(sys.argv[1], sys.argv[2])',
            's.socket = c.wrap_socket(s.socket, server_side=True)',
            's.serve_forever()'
          ) | Set-Content -Encoding ascii "$d\srv.py"
          $srv = Start-Process -FilePath python -ArgumentList "$d\srv.py", "$d\c.pem", "$d\k.pem" -PassThru -NoNewWindow
          try {
            # Il servizio di prova in Python può metterci più di 2 secondi a partire (run 60): si aspetta che la porta risponda.
            $up = $false
            for ($i = 0; $i -lt 40 -and -not $up; $i++) {
              try { $c = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 8445); $c.Close(); $up = $true } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $up) { throw "il servizio TLS di prova non è partito in 20 secondi" }
            $a = (./polaris-cli.exe certs 127.0.0.1:8445 localhost:8445 --json | ConvertFrom-Json).results
            if ($LASTEXITCODE -ne 0) { throw "certs fallito" }
            foreach ($r in $a) { "$($r.host):$($r.port) ok=$($r.ok) $($r.tlsVersion) giorni=$($r.daysLeft) autofirmato=$($r.selfSigned) nome=$($r.nameMatch) fiducia=$($r.trust) $($r.error)" }
            if (-not $a[0].ok -or -not $a[0].selfSigned -or -not $a[0].nameMatch -or $a[0].daysLeft -lt 18 -or $a[0].daysLeft -gt 20 -or $a[0].trust -ne 'untrusted-root') { throw "certificato autofirmato letto male" }
            if (-not $a[1].ok -or -not $a[1].nameMatch -or $a[1].subject -ne 'servizio-prova') { throw "certificato per nome letto male" }
            # Importato tra le radici attendibili del computer, Windows lo considera attendibile; poi si toglie.
            $imp = Import-Certificate -FilePath "$d\c.cer" -CertStoreLocation Cert:\LocalMachine\Root
            try {
              $b = (./polaris-cli.exe certs 127.0.0.1:8445 --json | ConvertFrom-Json).results[0]
              "Dopo l'importazione: fiducia=$($b.trust)"
              if ($b.trust -ne 'trusted') { throw "certificato importato non attendibile per Windows" }
            } finally { Remove-Item "Cert:\LocalMachine\Root\$($imp.Thumbprint)" -ErrorAction SilentlyContinue }
          } finally { Stop-Process $srv -ErrorAction SilentlyContinue }
          # Indirizzi pubblici rifiutati senza collegarsi.
          $p = (./polaris-cli.exe certs 1.1.1.1 --json | ConvertFrom-Json).results[0]
          if ($p.ok -or $p.error -notmatch 'pubblico') { throw "indirizzo pubblico non rifiutato" }
          "Indirizzo pubblico: $($p.error)"
      - name: Schermate blu (come BlueScreenView)
        timeout-minutes: 20
        run: |
          $raw = (./polaris-cli.exe crashes --json) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "crashes fallito" }
          $c = $raw | ConvertFrom-Json
          $set = $c.settings
          "Impostazioni lette da Polaris: dump=$($set.dumpEnabled) cartella='$($set.minidumpDir)' file='$($set.dumpFile)' riavvio=$($set.autoReboot) sovrascrivi=$($set.overwrite) registro=$($set.logEvent)"
          "Cartella dei minidump: $($c.folder); serve l'amministratore: $($c.needsAdmin); file: $($c.total); MEMORY.DMP: $(if ($c.memoryDump) { "$($c.memoryDump.code) $($c.memoryDump.dumpType)" } else { 'no' })"
          if ($null -eq $c.dumps) { throw "elenco dei dump mancante" }
          if ($null -eq $set -or $null -eq $set.dumpEnabled) { throw "impostazioni dei dump non lette" }
          if ($c.folder -notin @('ok', 'missing', 'denied', 'error')) { throw "stato della cartella inatteso: '$($c.folder)'" }
          if ($raw -match '\\Users\\') { throw "percorso di un profilo nel JSON" }
          # Gli stessi valori letti da PowerShell, e i permessi della cartella, per confronto.
          $cc = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl'
          "CrashControl (PowerShell): CrashDumpEnabled=$($cc.CrashDumpEnabled) MinidumpDir='$($cc.MinidumpDir)' DumpFile='$($cc.DumpFile)' AutoReboot=$($cc.AutoReboot) Overwrite=$($cc.Overwrite) LogEvent=$($cc.LogEvent)"
          if ($null -ne $cc.CrashDumpEnabled -and $cc.CrashDumpEnabled -ne $set.dumpEnabled) { throw "CrashDumpEnabled letto male: $($set.dumpEnabled) invece di $($cc.CrashDumpEnabled)" }
          $md = Join-Path $env:SystemRoot 'Minidump'
          if (Test-Path $md) { icacls $md } else { "Cartella $md assente" }
          # Il rapporto completo contiene la lettura.
          $s = Get-Content scan.json -Raw | ConvertFrom-Json
          if ($null -eq $s.pc.crashes) { throw "pc.crashes assente nel rapporto" }
          "Nel rapporto: $($s.pc.crashes.total) file, cartella $($s.pc.crashes.folder), parziale=$($s.pc.crashes.partial)"
          # Un dump vero di Windows: istantanea del kernel senza arresto, come "Crea file di dump della memoria
          # del kernel in tempo reale" di Gestione attività (NtSystemDebugControl, comando 37, struttura
          # SYSDBG_LIVEDUMP_CONTROL versione 1 come negli header aperti phnt), con codice e parametri scelti qui.
          # Polaris la legge mettendo la sua cartella come cartella dei minidump e deve ritrovare gli stessi valori.
          # Se Windows non la crea si dice e si prosegue; se c'è, va letta bene.
          $ld = Join-Path $env:RUNNER_TEMP 'livedump'
          New-Item -ItemType Directory -Force $ld | Out-Null
          $want = @{ code = '0x00000161'; p = @('0x0000000000001111', '0x0000000000002222', '0x0000000000003333', '0x0000000000004444') }
          try {
            Add-Type -TypeDefinition (@(
              'using System; using System.Runtime.InteropServices;',
              'public static class PolarisLiveDump {',
              '  [StructLayout(LayoutKind.Sequential)] public struct Control { public uint Version; public uint Code; public ulong P1, P2, P3, P4; public IntPtr File; public IntPtr Cancel; public uint Flags; public uint AddPages; }',
              '  [DllImport("ntdll.dll")] public static extern int NtSystemDebugControl(int cmd, ref Control input, int inLen, IntPtr output, int outLen, out int retLen);',
              '  [DllImport("ntdll.dll")] public static extern int RtlAdjustPrivilege(int privilege, bool enable, bool currentThread, out bool wasEnabled);',
              '}') -join "`n")
            $was = $false
            $pr = [PolarisLiveDump]::RtlAdjustPrivilege(20, $true, $false, [ref]$was)
            $fs = [IO.File]::Open((Join-Path $ld 'livedump.dmp'), 'Create', 'ReadWrite', 'None')
            try {
              $ctl = New-Object PolarisLiveDump+Control
              $ctl.Version = 1; $ctl.Code = 0x161; $ctl.P1 = 0x1111; $ctl.P2 = 0x2222; $ctl.P3 = 0x3333; $ctl.P4 = 0x4444
              $ctl.File = $fs.SafeFileHandle.DangerousGetHandle()
              $rl = 0
              $st = [PolarisLiveDump]::NtSystemDebugControl(37, [ref]$ctl, [Runtime.InteropServices.Marshal]::SizeOf($ctl), [IntPtr]::Zero, 0, [ref]$rl)
              "Istantanea del kernel: privilegio 0x$('{0:X8}' -f $pr), NtSystemDebugControl 0x$('{0:X8}' -f $st), $([math]::Round($fs.Length / 1MB)) MB"
            } finally { $fs.Dispose() }
            if ((Get-Item (Join-Path $ld 'livedump.dmp')).Length -eq 0) { Remove-Item (Join-Path $ld 'livedump.dmp') }
          } catch { "Istantanea del kernel non creata: $($_.Exception.Message)" }
          $dmp = Get-ChildItem $ld -Recurse -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dmp) {
            "Nessun dump vero creato su questo runner: lettura di un dump reale non provata"
          } else {
            "Dump vero: $($dmp.Name), $([math]::Round($dmp.Length / 1MB)) MB"
            $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl'
            $old = (Get-Item $key).GetValue('MinidumpDir', $null, 'DoNotExpandEnvironmentNames')
            Set-ItemProperty $key -Name MinidumpDir -Value $dmp.DirectoryName -Type ExpandString
            try {
              $c2 = ./polaris-cli.exe crashes --json | ConvertFrom-Json
              $x = $c2.dumps | Where-Object file -eq $dmp.Name
              if (-not $x) { throw "dump vero non elencato (cartella $($c2.folder), $($c2.total) file)" }
              "Letto da Polaris: codice $($x.code) parametri $($x.params -join ' ') bit $($x.bits) macchina $($x.machine) build $($x.build) processori $($x.processors) tipo $($x.dumpType) limitato '$($x.limited)' ora $($x.time) errore '$($x.error)'"
              if ($x.error) { throw "dump vero non letto: $($x.error)" }
              if ($x.bits -ne 64 -or $x.machine -ne 'x64' -or -not $x.code) { throw "intestazione del dump letta male" }
              if ($x.code -ne $want.code -or ($x.params -join ' ') -ne ($want.p -join ' ')) { throw "codice o parametri letti male: $($x.code) $($x.params -join ' ')" }
              $build = [Environment]::OSVersion.Version.Build
              if ($x.build -ne $build) { throw "build $($x.build) diversa da quella del sistema ($build)" }
              if ($x.processors -ne [Environment]::ProcessorCount) { "Processori: $($x.processors) nel dump, $([Environment]::ProcessorCount) per .NET" }
              $age = ([datetime]::UtcNow - ([datetime]$x.time).ToUniversalTime()).TotalMinutes
              "Ora del dump: $([math]::Round($age, 1)) minuti fa"
              if ([math]::Abs($age) -gt 60) { throw "ora del dump letta male" }
            } finally {
              if ($null -eq $old) { Remove-ItemProperty $key -Name MinidumpDir }
              else { Set-ItemProperty $key -Name MinidumpDir -Value $old -Type ExpandString }
              Remove-Item $ld -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Mappa del Wi-Fi e test di velocità di Internet (senza M-Lab)
        timeout-minutes: 6
        run: |
          # Mappa del Wi-Fi: i runner non hanno una scheda Wi-Fi; la misura deve fallire in modo pulito,
          # in italiano, senza errori interni, entro il tempo della misura.
          $t0 = Get-Date
          $o = (./polaris-cli.exe wifi-survey Prova CI --secondi 10 --senza-scansione --json 2>&1) -join "`n"
          $code = $LASTEXITCODE
          "wifi-survey: uscita $code in $([math]::Round(((Get-Date) - $t0).TotalSeconds, 1)) s"
          $o
          if ($o -match 'panic|goroutine') { throw "errore interno nella misura del Wi-Fi" }
          if ($code -eq 0) {
            $w = $o.Substring($o.IndexOf('{')) | ConvertFrom-Json
            if ($w.rssi.Count -lt 5 -or -not $w.ssid) { throw "misura incompleta" }
            if ($o -match '\b[0-9a-f]{2}(:[0-9a-f]{2}){5}\b' -and -not $w.bssids) { throw "BSSID fuori posto" }
          } elseif ($o -notmatch 'Wi-Fi|wlanapi|WLAN|posizione') { throw "messaggio di errore inatteso" }
          # Test di velocità: senza --accetto si mostra solo il consenso, nessun traffico.
          $tx = (./polaris-cli.exe speedtest) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "speedtest senza consenso: uscita $LASTEXITCODE" }
          if ($tx -notmatch 'speedtest --accetto' -or $tx -notmatch 'measurementlab\.net/privacy') { throw "testo del consenso incompleto" }
          "Consenso mostrato ($($tx.Length) caratteri), nessun test avviato"
          # API: richieste non valide rifiutate; nessun test reale (pubblicherebbe l'indirizzo del runner).
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve', '--port', '8738' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $base = 'http://127.0.0.1:8738/api'
            foreach ($case in @(@{ u = "$base/speedtest"; b = '{}'; code = 400 }, @{ u = "$base/speedtest"; b = '{"consent":"si"}'; code = 400 }, @{ u = "$base/wifi/survey"; b = '{"room":""}'; code = 400 }, @{ u = "$base/wifi/survey"; b = '{"room":"Studio","seconds":5}'; code = 400 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.b $case.u | Out-Null
                throw "accettato: $($case.u) $($case.b)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.u) $($case.b): $($_.Exception.Message)" }
              }
            }
            $st = Invoke-RestMethod "$base/speedtest"
            "Stato del test di velocità: in corso=$($st.running), test rimasti oggi=$($st.left)"
            if ($st.running -or $st.left -ne 10) { throw "stato iniziale del test di velocità inatteso" }
            # Una misura del Wi-Fi via API: parte e finisce (con un errore, senza scheda Wi-Fi) e non consuma
            # test di velocità (l'esclusione reciproca è provata nei test Go dell'agente).
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"room":"Studio","seconds":10,"scan":false}' "$base/wifi/survey" | Out-Null
            $t = 0
            do { Start-Sleep 1; $t++; $sv = Invoke-RestMethod "$base/wifi/survey" } while ($sv.running -and $t -lt 40)
            "Misura via API: in corso=$($sv.running) errore='$($sv.error)' esito=$(if ($sv.result) { 'sì' } else { 'no' })"
            if ($sv.running) { throw "la misura del Wi-Fi non è finita" }
            if (-not $sv.error -and -not $sv.result) { throw "misura senza esito né errore" }
            $st = Invoke-RestMethod "$base/speedtest"
            if ($st.left -ne 10) { throw "un test di velocità è stato consumato" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Scoperta delle reti e delle VLAN (rotte, annunci dello switch, Active Directory, SNMP)
        timeout-minutes: 6
        run: |
          # Rotte verso altre reti private: il comando non fallisce, anche senza rotte.
          $r = (./polaris-cli.exe discover routes --json) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "discover routes: uscita $LASTEXITCODE" }
          "Rotte verso reti private: $r"
          $s = Get-Content scan.json -Raw | ConvertFrom-Json
          "Rotte nell'analisi: $(@($s.lan.routes).Count)"
          # Annunci dello switch: il runner è amministratore. In una macchina virtuale di solito non
          # arriva nulla; conta che l'ascolto parta, finisca entro il tempo, risponda in italiano e
          # non lasci sessioni di cattura o file temporanei.
          $t0 = Get-Date
          $o = (./polaris-cli.exe discover l2 --secondi 10 --json 2>&1) -join "`n"
          $code = $LASTEXITCODE
          "discover l2: uscita $code in $([math]::Round(((Get-Date) - $t0).TotalSeconds, 1)) s"
          $o
          if ($o -match 'panic|goroutine') { throw "errore interno nell'ascolto" }
          $d = $o.Substring($o.IndexOf('{')) | ConvertFrom-Json
          "Esito dell'ascolto: $($d.read), $($d.frames) trame, schede: $($d.adapters -join ', ') $($d.error)"
          if ($d.read -notin @('ok', 'none', 'nowired', 'unsupported', 'error')) { throw "stato dell'ascolto inatteso: $($d.read)" }
          $left = Get-NetEventSession -ErrorAction SilentlyContinue | Where-Object Name -like 'Polaris-L2-*'
          if ($left) { throw "sessione di cattura rimasta aperta: $($left.Name -join ', ')" }
          $tmp = Get-ChildItem -Path $env:TEMP -Filter 'polaris-l2-*' -ErrorAction SilentlyContinue
          if ($tmp) { throw "file temporanei dell'ascolto non cancellati: $($tmp.Name -join ', ')" }
          # Active Directory: il runner non è in un dominio.
          $ad = ./polaris-cli.exe discover ad --json | ConvertFrom-Json
          "Active Directory: $($ad.read) $($ad.error)"
          if ($ad.read -ne 'nodomain') { throw "atteso nodomain, ottenuto $($ad.read)" }
          # SNMP: senza autorizzazione e verso un indirizzo pubblico non parte nulla; la community
          # non compare mai nei messaggi.
          $env:POLARIS_SNMP_COMMUNITY = 'segreta-di-prova'
          $n0 = (./polaris-cli.exe discover snmp 10.255.255.1 2>&1) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $n0 -notmatch 'autorizzato') { throw "SNMP senza autorizzazione accettato: $n0" }
          $n1 = (./polaris-cli.exe discover snmp 8.8.8.8 --autorizzato 2>&1) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $n1 -notmatch 'privat') { throw "SNMP verso un indirizzo pubblico accettato: $n1" }
          if ("$n0 $n1" -match 'segreta-di-prova') { throw "community nell'output" }
          "SNMP rifiutato come previsto: $n1"
          # I rifiuti attesi lasciano l'uscita 1: non è l'esito del passo.
          $global:LASTEXITCODE = 0
          # API: richieste non valide rifiutate, stato iniziale vuoto, Active Directory via API.
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve', '--port', '8739' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $base = 'http://127.0.0.1:8739/api/discover'
            foreach ($case in @(@{ u = "$base/l2"; b = '{"seconds":5}'; code = 400 }, @{ u = "$base/snmp"; b = '{"target":"10.0.0.2","creds":{"version":"2c","community":"x"}}'; code = 400 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.b $case.u | Out-Null
                throw "accettato: $($case.u) $($case.b)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.u) $($case.b): $($_.Exception.Message)" }
              }
            }
            $st = Invoke-RestMethod "$base/snmp"
            if ($st.running -or @($st.results).Count -ne 0) { throw "stato SNMP iniziale inatteso" }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' "$base/ad" | Out-Null
            $t = 0
            do { Start-Sleep 1; $t++; $a = Invoke-RestMethod "$base/ad" } while ($a.running -and $t -lt 40)
            "Active Directory via API: $($a.result.read)"
            if ($a.result.read -ne 'nodomain') { throw "Active Directory via API: atteso nodomain" }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
          exit 0
      - name: Voci italiane per le videoguide (informativo)
        continue-on-error: true
        run: |
          # Le videoguide hanno una narrazione registrata; in alternativa usano le voci locali di Windows
          # (Elsa per l'italiano), se installate:
          # i runner sono in inglese, quindi qui si elencano soltanto.
          Add-Type -AssemblyName System.Speech
          $v = (New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | ForEach-Object { "$($_.VoiceInfo.Name) [$($_.VoiceInfo.Culture)]" }
          "Voci SAPI: $($v -join '; ')"
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Speech_OneCore\Voices\Tokens' -ErrorAction SilentlyContinue | ForEach-Object { "Voce OneCore: $($_.PSChildName)" }
      - name: Test di velocità da riga di comando
        run: |
          $c = ./polaris-cli.exe bench cpu --quick --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bench cpu fallito" }
          "Processore: $($c.threads) thread; un thread $($c.singleMBs) MB/s; tutti $($c.multiMBs) MB/s; alla fine $($c.sustainedMBs) MB/s; AC=$($c.onAC)"
          if ($c.singleMBs -le 0 -or $c.multiMBs -le 0) { throw "risultato del processore non valido" }
          $d = ./polaris-cli.exe bench disk --quick --json --drive $env:SystemDrive | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "bench disk fallito" }
          "Disco $($d.drive) (file $($d.fileMB) MB), lettura/scrittura in MB/s: SEQ1M Q8T1 $($d.seqQ8ReadMBs)/$($d.seqQ8WriteMBs); SEQ1M Q1T1 $($d.seqReadMBs)/$($d.seqWriteMBs); RND4K Q32T1 $($d.rndQ32ReadMBs)/$($d.rndQ32WriteMBs) ($($d.rndQ32ReadIops)/$($d.rndQ32WriteIops) IOPS); RND4K Q1T1 $($d.rndReadMBs)/$($d.rndWriteMBs) ($($d.rndReadIops)/$($d.rndWriteIops) IOPS) $($d.note)"
          if ($d.seqReadMBs -le 0 -or $d.rndReadIops -le 0) { throw "risultato del disco non valido" }
          if ($d.seqQ8ReadMBs -le 0 -or $d.seqQ8WriteMBs -le 0 -or $d.rndQ32ReadIops -le 0 -or $d.rndQ32WriteIops -le 0) { throw "misure con più richieste in coda non valide" }
          $left = Get-ChildItem -Path $env:TEMP -Filter 'polaris-test-*' -ErrorAction SilentlyContinue
          if ($left) { throw "file di prova non cancellati: $($left.Name -join ', ')" }
      - name: Server locale e API
        run: |
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8737' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $info = Invoke-RestMethod http://127.0.0.1:8737/api/info
            "Agente: $($info.name) $($info.version) su $($info.host)"
            $r = Invoke-WebRequest http://127.0.0.1:8737/api/scan -UseBasicParsing
            if ($r.StatusCode -ne 204) { throw "atteso 204 prima dell'analisi, ottenuto $($r.StatusCode)" }
            Invoke-RestMethod -Method Post http://127.0.0.1:8737/api/scan | Out-Null
            $t = 0
            do { Start-Sleep 1; $t++; $pr = Invoke-RestMethod http://127.0.0.1:8737/api/progress } while ($pr.running -and $t -lt 90)
            ($pr.steps | ForEach-Object { "$($_.state.PadRight(7)) $($_.label)" }) -join "`n"
            $scan = Invoke-RestMethod http://127.0.0.1:8737/api/scan
            if (-not $scan.gateway.ip) { throw "analisi via API senza gateway" }
            $ping = Invoke-RestMethod "http://127.0.0.1:8737/api/ping?target=gateway"
            "Ping singolo verso il router: $($ping.ms) ms"
            # Infrastruttura: nessun inventario senza conferma (nessuna scansione della rete della CI);
            # una sola verifica di raggiungibilità, un ping verso il gateway.
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"authorized":false}' http://127.0.0.1:8737/api/inventory | Out-Null
              throw "inventario accettato senza conferma"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 400) { throw "atteso 400 senza conferma: $($_.Exception.Message)" }
            }
            $body = @{ targets = @(@{ label = 'gateway'; host = $scan.gateway.ip; expect = 'reachable' }) } | ConvertTo-Json -Depth 4
            $reach = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body http://127.0.0.1:8737/api/reach
            "Verifica verso il gateway da $($reach.from): $($reach.results[0].status)"
            if (-not $reach.results[0].status) { throw "verifica senza esito" }
            # Test di velocità via API: conferma obbligatoria per il disco, unità inesistente rifiutata subito.
            foreach ($case in @(@{ body = '{"kind":"disk","drive":"C:"}'; code = 400 }, @{ body = '{"kind":"disk","drive":"Q:","confirm":true}'; code = 422 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.body http://127.0.0.1:8737/api/bench | Out-Null
                throw "accettato: $($case.body)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.body): $($_.Exception.Message)" }
              }
            }
            # Microsoft Defender: azione arbitraria rifiutata; una scansione rapida parte,
            # blocca i test di velocità e si interrompe (la scansione intera è nel passo dopo).
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"action":"format"}' http://127.0.0.1:8737/api/defender | Out-Null
              throw "azione arbitraria accettata"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 400) { throw "atteso 400 per un'azione non valida: $($_.Exception.Message)" }
            }
            $started = $true
            try { Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"action":"quick"}' http://127.0.0.1:8737/api/defender | Out-Null }
            catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 422) { throw "avvio della scansione: $($_.Exception.Message)" }
              "Defender non disponibile su questo runner: $($_.ErrorDetails.Message)"; $started = $false
            }
            if ($started) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"kind":"cpu"}' http://127.0.0.1:8737/api/bench | Out-Null
                # Accettato: lecito solo se la scansione era già finita; si attende la fine del test.
                $busy = Invoke-RestMethod http://127.0.0.1:8737/api/defender
                if ($busy.running) { throw "test di velocità accettato durante la scansione" }
                do { Start-Sleep 1; $b0 = Invoke-RestMethod http://127.0.0.1:8737/api/bench } while ($b0.running)
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 409) { throw "atteso 409 durante la scansione: $($_.Exception.Message)" }
              }
              Invoke-RestMethod -Method Delete http://127.0.0.1:8737/api/defender | Out-Null
              $t = 0
              do { Start-Sleep 1; $t++; $df = Invoke-RestMethod http://127.0.0.1:8737/api/defender } while ($df.running -and $t -lt 60)
              "Scansione interrotta via API: running=$($df.running) errore='$($df.error)' esito='$($df.result.message)'"
              if ($df.running) { throw "la scansione non si è fermata" }
            }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"kind":"cpu"}' http://127.0.0.1:8737/api/bench | Out-Null
            $t = 0
            do { Start-Sleep 1; $t++; $b = Invoke-RestMethod http://127.0.0.1:8737/api/bench } while ($b.running -and $t -lt 90)
            "Test del processore via API: $($b.cpu.singleMBs) / $($b.cpu.multiMBs) / $($b.cpu.sustainedMBs) MB/s in $($b.cpu.durationMs) ms; campioni: $($b.cpu.samples -join ' ')"
            if ($b.error -or -not $b.cpu.multiMBs) { throw "test del processore via API non riuscito: $($b.error)" }
            $html = Invoke-WebRequest http://127.0.0.1:8737/ -UseBasicParsing
            if ($html.Content -notmatch '<title>STARNET Polaris</title>') { throw "interfaccia non servita" }
            if (-not $html.Headers['Content-Security-Policy']) { throw "CSP mancante" }
            # Narrazione delle videoguide: una registrazione, presa dall'interfaccia, deve arrivare come audio Ogg.
            $js = ([regex]'assets/index-[\w-]+\.js').Match($html.Content).Value
            if (-not $js) { throw "script dell'interfaccia non trovato nella pagina" }
            $code = (Invoke-WebRequest "http://127.0.0.1:8737/$js" -UseBasicParsing).Content
            $ogg = ([regex]'[0-9a-f]{12}-[\w-]+\.ogg').Match($code).Value
            if (-not $ogg) { throw "nessuna registrazione della narrazione nell'interfaccia" }
            $clip = Invoke-WebRequest "http://127.0.0.1:8737/assets/$ogg" -UseBasicParsing
            if ("$($clip.Headers['Content-Type'])" -ne 'audio/ogg') { throw "registrazione servita come $($clip.Headers['Content-Type'])" }
            if ([Text.Encoding]::ASCII.GetString([byte[]]$clip.Content[0..3]) -ne 'OggS') { throw "la registrazione servita non è un file Ogg" }
            "Narrazione delle videoguide: $ogg servita come audio/ogg, $($clip.Content.Length) byte"
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Programmi inclusi (CrystalDiskInfo, CrystalDiskMark, BlueScreenView, UsbTreeView)
        run: |
          $exes = @{ crystaldiskinfo = 'strumenti/CrystalDiskInfo/DiskInfo64.exe'; crystaldiskmark = 'strumenti/CrystalDiskMark/DiskMark64.exe' }
          foreach ($id in $exes.Keys) {
            $sig = Get-AuthenticodeSignature $exes[$id]
            "$id`: firma $($sig.Status), $($sig.SignerCertificate.Subject -replace ',.*$', '')"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'CN=CrystalMark Inc\.') { throw "firma di $($exes[$id]) non valida" }
          }
          # BlueScreenView si verifica con l'impronta: la sua firma del 2015 usa un certificato scaduto.
          $bsv = Get-AuthenticodeSignature 'strumenti/BlueScreenView/BlueScreenView.exe'
          "bluescreenview: firma $($bsv.Status), $($bsv.SignerCertificate.Subject -replace ',.*$', '') (informativo)"
          # UsbTreeView: nel pacchetto per x64 solo la sua versione, verificata con l'impronta.
          if ((Test-Path 'strumenti/UsbTreeView/arm64') -or (Test-Path 'strumenti/UsbTreeView/Win32')) { throw "UsbTreeView di altre architetture nel pacchetto x64" }
          $utv = Get-AuthenticodeSignature 'strumenti/UsbTreeView/x64/UsbTreeView.exe'
          "usbtreeview: firma $($utv.Status), $($utv.SignerCertificate.Subject -replace ',.*$', '') (informativo)"
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8738' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8738/api'
            $t = Invoke-RestMethod "$api/tools"
            "Inclusi: CrystalDiskInfo $($t.bundled.crystaldiskinfo.version), CrystalDiskMark $($t.bundled.crystaldiskmark.version), BlueScreenView $($t.bundled.bluescreenview.version), UsbTreeView $($t.bundled.usbtreeview.version)"
            foreach ($id in @($exes.Keys) + 'bluescreenview' + 'usbtreeview') {
              if (-not $t.bundled.$id.version -or $t.bundled.$id.problem) { throw "$id non riconosciuto come copia integra: $($t | ConvertTo-Json -Compress)" }
            }
            # Avvio con un clic (come dall'interfaccia), poi chiusura.
            foreach ($c in @(@{ id = 'crystaldiskmark'; proc = 'DiskMark64' }, @{ id = 'crystaldiskinfo'; proc = 'DiskInfo64' }, @{ id = 'bluescreenview'; proc = 'BlueScreenView' }, @{ id = 'usbtreeview'; proc = 'UsbTreeView' })) {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body "{`"tool`":`"$($c.id)`",`"target`":`"app`"}" -TimeoutSec 30 "$api/open" | Out-Null
              $t0 = 0
              do { Start-Sleep 1; $t0++; $run = Get-Process $c.proc -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 15)
              if (-not $run) { throw "$($c.proc) non avviato" }
              "$($c.proc) avviato da Polaris (PID $($run[0].Id) dalla cartella $(Split-Path $run[0].Path -Parent | Split-Path -Leaf))"
              Stop-Process -Name $c.proc -Force
            }
            # Una copia alterata non si avvia.
            $exe = $exes.crystaldiskmark
            Copy-Item $exe "$exe.orig"
            Add-Content -Path $exe -Value 'x' -NoNewline
            try {
              $t = Invoke-RestMethod "$api/tools"
              if (-not $t.bundled.crystaldiskmark.problem) { throw "copia alterata non segnalata" }
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"crystaldiskmark","target":"app"}' -TimeoutSec 30 "$api/open" | Out-Null
                throw "copia alterata avviata"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 422) { throw "atteso 422 per la copia alterata: $($_.Exception.Message)" }
              }
              if (Get-Process DiskMark64 -ErrorAction SilentlyContinue) { throw "copia alterata in esecuzione" }
              "Copia alterata rifiutata: $($t.bundled.crystaldiskmark.problem)"
            } finally { Move-Item -Force "$exe.orig" $exe }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Pagine dei passi del piano e pannello del router
        run: |
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8739' -PassThru -NoNewWindow
          try {
            $api = 'http://127.0.0.1:8739/api'
            # Si aspetta che il server risponda invece di un ritardo fisso.
            $up = $false
            for ($i = 0; $i -lt 40 -and -not $up; $i++) {
              try { Invoke-RestMethod "$api/tools" -TimeoutSec 5 | Out-Null; $up = $true } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $up) { throw "il server locale non risponde dopo 20 secondi" }
            # Pagine aperte dai passi (programmi di Windows della lista bianca): Certificati del computer e
            # Impostazioni di sistema avanzate sono usati dai passi, il Controllo dell'account utente servirà
            # alla 0.12.0. Si aprono con un clic, poi si chiudono. Nelle run 62 e 64
            # SystemPropertiesAdvanced non risultava in esecuzione dopo l'apertura (nella 63 sì): si
            # registrano gli avvii dei processi con Win32_ProcessStartTrace, così si distingue un
            # programma che Polaris non avvia (errore) da uno che parte e si chiude subito nella
            # sessione non interattiva del runner (scritto nel log).
            Register-CimIndicationEvent -ClassName Win32_ProcessStartTrace -SourceIdentifier polarisAvvii
            try {
              foreach ($c in @(@{ id = 'certificates-computer'; proc = 'mmc' }, @{ id = 'advanced-system'; proc = 'SystemPropertiesAdvanced' }, @{ id = 'uac-settings'; proc = 'UserAccountControlSettings' })) {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body "{`"tool`":`"$($c.id)`",`"target`":`"app`"}" -TimeoutSec 30 "$api/open" | Out-Null
                $t0 = 0; $run = $null; $seen = $false
                do {
                  Start-Sleep 1; $t0++
                  $run = Get-Process $c.proc -ErrorAction SilentlyContinue
                  $seen = @(Get-Event -SourceIdentifier polarisAvvii -ErrorAction SilentlyContinue | Where-Object { $_.SourceEventArgs.NewEvent.ProcessName -eq "$($c.proc).exe" }).Count -gt 0
                } while (-not $run -and -not $seen -and $t0 -lt 15)
                if ($run) { "$($c.id) aperto da Polaris ($($c.proc), PID $($run[0].Id))"; Stop-Process -Name $c.proc -Force }
                elseif ($seen) { "$($c.id): $($c.proc).exe avviato da Polaris e chiuso subito (sessione del runner)" }
                else { throw "$($c.id): $($c.proc) non avviato" }
                Get-Event -SourceIdentifier polarisAvvii -ErrorAction SilentlyContinue | Remove-Event
              }
            } finally { Unregister-Event -SourceIdentifier polarisAvvii -ErrorAction SilentlyContinue }
            # Una pagina di Impostazioni (prova non bloccante: sul runner l'app Impostazioni può non partire fuori da una sessione interattiva).
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"about","target":"app"}' -TimeoutSec 30 "$api/open" | Out-Null
              $t0 = 0
              do { Start-Sleep 1; $t0++; $run = Get-Process SystemSettings -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 15)
              if ($run) { "about (ms-settings:about) aperto: SystemSettings, PID $($run[0].Id)"; Stop-Process -Name SystemSettings -Force -ErrorAction SilentlyContinue }
              else { "about (ms-settings:about): richiesta accettata, SystemSettings non visto (prova non bloccante)" }
            } catch { "about (ms-settings:about) non aperto: $($_.Exception.Message) (prova non bloccante)" }
            # Il pannello del router si apre solo come sito e solo con il gateway di un'analisi: qui non ce n'è.
            foreach ($b in @(@{ body = '{"tool":"router-panel","target":"app"}'; code = 400 }, @{ body = '{"tool":"router-panel","target":"site"}'; code = 422 })) {
              $got = 0
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $b.body -TimeoutSec 30 "$api/open" | Out-Null
              } catch { $got = $_.Exception.Response.StatusCode.value__ }
              if ($got -ne $b.code) { throw "atteso $($b.code) per $($b.body), ricevuto $got" }
              "Pannello del router rifiutato come previsto ($got): $($b.body)"
            }
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Versioni portable dal sito ufficiale (Autoruns, CPU-Z, Rufus, Memtest86+)
        timeout-minutes: 8
        run: |
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8739' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8739/api'
            # Programma fuori catalogo o senza versione portable: rifiutato.
            foreach ($case in @(@{ body = '{"tool":"cmd.exe"}'; code = 404 }, @{ body = '{"tool":"crystaldiskinfo"}'; code = 400 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.body "$api/tools/fetch" | Out-Null
                throw "accettato: $($case.body)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.body): $($_.Exception.Message)" }
              }
            }
            foreach ($id in 'autoruns', 'cpu-z') {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body "{`"tool`":`"$id`"}" "$api/tools/fetch" | Out-Null
              $t0 = 0
              do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 180)
              if ($st.fetch.running -or $st.fetch.error) { throw "$id`: download non riuscito: $($st.fetch.error)" }
              $d = $st.portable.$id
              "$id`: scaricato $([math]::Round($st.fetch.done / 1MB, 1)) MB, versione $($d.version), firma di $($d.signer), data $($d.date)"
              if (-not $d.signer -or $d.problem) { throw "$id non verificato: $($st | ConvertTo-Json -Compress -Depth 4)" }
            }
            if ($st.portable.'cpu-z'.signer -ne 'CPUID' -or $st.portable.autoruns.signer -ne 'Microsoft Corporation') { throw "firmatari inattesi" }
            # Rufus dalle release su GitHub indicate da rufus.ie, con la firma di Akeo Consulting;
            # Memtest86+ è un'immagine da scrivere su chiavetta: impronta del sito, nessuna firma, si mostra in Esplora file.
            foreach ($id in 'rufus', 'memtest86plus') {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body "{`"tool`":`"$id`"}" "$api/tools/fetch" | Out-Null
              $t0 = 0
              do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 180)
              if ($st.fetch.running -or $st.fetch.error) { throw "$id`: download non riuscito: $($st.fetch.error)" }
              $d = $st.portable.$id
              "$id`: scaricato $([math]::Round($st.fetch.done / 1MB, 1)) MB, versione $($d.version), firma di '$($d.signer)', data $($d.date)"
              if ($d.problem) { throw "$id non verificato: $($st | ConvertTo-Json -Compress -Depth 4)" }
            }
            if ($st.portable.rufus.signer -ne 'Akeo Consulting' -or $st.portable.rufus.version -ne '4.15') { throw "Rufus: firma o versione inattese" }
            if ($st.portable.memtest86plus.version -ne '9.00' -or $st.portable.memtest86plus.signer) { throw "Memtest86+: versione o firma inattese" }
            $iso = Join-Path $env:LOCALAPPDATA 'STARNET Polaris\strumenti\memtest86plus\memtest.iso'
            if (-not (Test-Path $iso) -or (Get-Item $iso).Length -lt 1MB) { throw "immagine di Memtest86+ mancante" }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"memtest86plus","target":"app"}' -TimeoutSec 30 "$api/open" | Out-Null
            "Memtest86+: cartella mostrata in Esplora file ($([math]::Round((Get-Item $iso).Length / 1MB, 1)) MB)"
            $dir = Join-Path $env:LOCALAPPDATA 'STARNET Polaris\strumenti\autoruns'
            "Cartella: $dir ($((Get-ChildItem $dir).Count) file)"
            # Avvio con la firma verificata di nuovo, poi chiusura.
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns","target":"app"}' -TimeoutSec 60 "$api/open" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $run = Get-Process Autoruns64 -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 20)
            if (-not $run) { throw "Autoruns64 non avviato" }
            "Autoruns64 avviato da Polaris (PID $($run[0].Id))"
            Stop-Process -Name Autoruns64 -Force
            Start-Sleep 1
            # Copia alterata dopo il download: segnalata, non avviata, eliminabile.
            Add-Content -Path (Join-Path $dir 'Autoruns64.exe') -Value 'x' -NoNewline
            $st = Invoke-RestMethod "$api/tools"
            if (-not $st.portable.autoruns.problem) { throw "copia alterata non segnalata" }
            try {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns","target":"app"}' -TimeoutSec 60 "$api/open" | Out-Null
              throw "copia alterata avviata"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 422) { throw "atteso 422 per la copia alterata: $($_.Exception.Message)" }
            }
            if (Get-Process Autoruns64 -ErrorAction SilentlyContinue) { throw "copia alterata in esecuzione" }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns"}' "$api/tools/remove" | Out-Null
            if (Test-Path $dir) { throw "copia non eliminata" }
            "Copia alterata rifiutata ed eliminata: $($st.portable.autoruns.problem)"
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }
      - name: Kit per l'uso senza Internet (Autoruns su un altro profilo, con la rete bloccata)
        timeout-minutes: 8
        run: |
          $kit = Join-Path $PWD 'strumenti-scaricati'
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8740' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8740/api'
            foreach ($case in @(@{ body = '{"tools":["cmd.exe"]}'; code = 404 }, @{ body = '{"tools":[]}'; code = 400 })) {
              try {
                Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $case.body "$api/tools/kit" | Out-Null
                throw "accettato: $($case.body)"
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne $case.code) { throw "atteso $($case.code) per $($case.body): $($_.Exception.Message)" }
              }
            }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tools":["autoruns"]}' "$api/tools/kit" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 180)
            if ($st.fetch.running -or $st.fetch.failed -or -not ($st.fetch.ready -contains 'autoruns')) { throw "kit non preparato: $($st.fetch | ConvertTo-Json -Compress -Depth 4)" }
            if (-not (Test-Path (Join-Path $kit 'autoruns\Autoruns64.exe')) -or -not (Test-Path (Join-Path $kit 'LEGGIMI.txt'))) { throw "cartella del kit incompleta" }
            $d = $st.portable.autoruns
            "Kit preparato: $((Get-ChildItem $kit -Recurse -File).Count) file in strumenti-scaricati; Autoruns $($d.version), firma di $($d.signer), nel kit: $($d.kit)"
          } finally { Stop-Process $p -ErrorAction SilentlyContinue }

          # Un altro PC: profilo vuoto (nessuna copia in LOCALAPPDATA) e rete in uscita
          # bloccata dal firewall per Polaris e per la verifica della firma (PowerShell).
          $saved = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'altro-pc'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $fw = @(Get-NetFirewallProfile | Where-Object { $_.Enabled }).Count
          New-NetFirewallRule -DisplayName 'polaris-senza-rete' -Direction Outbound -Action Block -Program (Resolve-Path ./polaris-cli.exe).Path | Out-Null
          New-NetFirewallRule -DisplayName 'polaris-senza-rete-ps' -Direction Outbound -Action Block -Program "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" | Out-Null
          $p = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8741' -PassThru -NoNewWindow
          try {
            Start-Sleep 2
            $api = 'http://127.0.0.1:8741/api'
            ./polaris-cli.exe tools status
            $d = (Invoke-RestMethod "$api/tools").portable.autoruns
            if (-not $d.kit -or $d.problem) { throw "copia del kit non vista dall'altro profilo: $($d | ConvertTo-Json -Compress)" }
            # Senza rete il download non riesce...
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"cpu-z"}' "$api/tools/fetch" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $st = Invoke-RestMethod "$api/tools" } while ($st.fetch.running -and $t0 -lt 90)
            if ($fw -gt 0 -and -not $st.fetch.error) { throw "download riuscito con la rete bloccata" }
            "Firewall attivo su $fw profili; download di CPU-Z senza rete: $($st.fetch.error)"
            # ...ma la copia del kit si apre, con la firma verificata di nuovo.
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"tool":"autoruns","target":"app"}' -TimeoutSec 90 "$api/open" | Out-Null
            $t0 = 0
            do { Start-Sleep 1; $t0++; $run = Get-Process Autoruns64 -ErrorAction SilentlyContinue } while (-not $run -and $t0 -lt 20)
            if (-not $run) { throw "Autoruns64 dal kit non avviato" }
            "Autoruns64 avviato dal kit senza rete (PID $($run[0].Id))"
            Stop-Process -Name Autoruns64 -Force
          } finally {
            Stop-Process $p -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName 'polaris-senza-rete', 'polaris-senza-rete-ps' -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA = $saved
            Remove-Item -Recurse -Force $kit -ErrorAction SilentlyContinue
          }
      - name: Test della RAM con Windows acceso (versione breve)
        run: |
          $r = ./polaris-cli.exe bench ram --quick --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "test della RAM non riuscito" }
          "RAM: provati $($r.testedMB) MB su $($r.totalMB), bloccati $($r.lockedMB) MB, $($r.threads) thread, $($r.passes) passaggi, $($r.mbs) MB/s, errori $($r.errors), arresto $($r.stop)"
          "Prove: " + (($r.tests | ForEach-Object { "$($_.name) x$($_.runs)" }) -join ' ')
          if ($r.errors -ne 0) { throw "errori nella RAM della macchina di collaudo: $($r.badBits)" }
          if ($r.testedMB -ne 256 -or $r.passes -lt 1) { throw "test della RAM incompleto" }
          if ($r.lockedMB -lt $r.testedMB) { throw "memoria del test non bloccata in RAM (VirtualLock)" }
      - name: Sorgenti per le prove native
        uses: actions/checkout@v4
        with:
          path: sorgenti
      - uses: actions/setup-go@v5
        with:
          go-version-file: sorgenti/windows/go.mod
          cache-dependency-path: sorgenti/windows/go.sum
      - name: Prove native dell'agente su Windows reale
        working-directory: sorgenti/windows
        run: |
          # Letture native (registro eventi, dispositivi, servizi, volumi) con dati veri.
          go test ./internal/winevt/ ./internal/pcinfo/ -run 'Windows$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "prove native non riuscite" }
          # La modalità test letta da Polaris deve coincidere con quella di bcdedit (qui siamo amministratori).
          $bcd = (bcdedit /enum '{current}' | Select-String -Pattern '^testsigning\s+(\w+)').Matches.Groups[1].Value
          $s = Get-Content ../../STARNET-Polaris/scan.json -Raw | ConvertFrom-Json
          $ts = [bool]$s.pc.devices.codeIntegrity.testSigning
          "bcdedit testsigning: '$bcd'; Polaris: $ts (opzioni $($s.pc.devices.codeIntegrity.options))"
          if (($bcd -eq 'Yes') -ne $ts) { throw "modalità test diversa da bcdedit" }
      - name: Microsoft Defender da riga di comando (prova non bloccante)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          ./polaris-cli.exe defender status
          $r = ./polaris-cli.exe defender quick --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "scansione rapida non riuscita" }
          "Esito: $($r.message) in $([math]::Round($r.durationMs/1000)) s; minacce nuove: $($r.newThreats)"
      - name: Finestra grafica con WebView2 e narrazione in Edge (prove non bloccanti)
        continue-on-error: true
        run: |
          $gui = Start-Process -FilePath ./Polaris.exe -PassThru
          Start-Sleep 30
          $gui.Refresh()
          "Processo attivo: $(-not $gui.HasExited); titolo finestra: '$($gui.MainWindowTitle)'"
          "Processi WebView2: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\finestra.png")
          Stop-Process $gui -ErrorAction SilentlyContinue
          # Narrazione delle videoguide: una registrazione presa dall'interfaccia deve caricarsi e suonare fino alla
          # fine (a volume zero, con il consenso che nel programma dà il clic su "Guarda la videoguida"). Si prova in
          # Microsoft Edge senza finestra, che ha lo stesso motore di WebView2, contro l'interfaccia servita
          # dall'eseguibile. Dentro la finestra del programma non si riesce: il caricatore di WebView2 incorporato
          # (SDK 1.0.992.28) non apre la porta di debug né con la variabile d'ambiente né con la chiave di registro
          # previste per le prove (run 113 e 114).
          $js = @'
          (async () => {
            const tipo = document.createElement('audio').canPlayType('audio/ogg; codecs=opus');
            const js = [...document.scripts].map((s) => s.src).find((s) => /assets\/index-/.test(s));
            const ogg = ((await (await fetch(js)).text()).match(/[0-9a-f]{12}-[\w-]+\.ogg/) || [])[0];
            if (!ogg) return JSON.stringify({ tipo, esito: 'nessuna registrazione trovata' });
            const esito = await new Promise((fine) => {
              const a = new Audio(new URL('assets/' + ogg, location.href).href);
              a.muted = true;
              a.onended = () => fine('suonata fino alla fine, ' + a.duration.toFixed(2) + ' s');
              a.onerror = () => fine('errore ' + (a.error ? a.error.code : '?'));
              a.play().catch((e) => fine('avvio rifiutato: ' + e.name));
              setTimeout(() => fine('tempo scaduto a ' + a.currentTime.toFixed(2) + ' s, stato ' + a.readyState), 25000);
            });
            return JSON.stringify({ tipo, ogg, esito, motore: navigator.userAgent.replace(/^.*(Edg\/[\d.]+).*$/, '$1') });
          })()
          '@
          function Suona([int]$porta) {
            # In PowerShell 7 l'elenco arriva come un solo oggetto: passando dalla variabile lo si scorre voce per voce.
            $elenco = Invoke-RestMethod "http://127.0.0.1:$porta/json"
            $pagina = $elenco | Where-Object { $_.type -eq 'page' -and $_.url -like 'http://127.0.0.1*' } | Select-Object -First 1
            if (-not $pagina) { throw "nessuna pagina del programma sulla porta di debug" }
            $fine = [Threading.CancellationTokenSource]::new(60000).Token
            $ws = [System.Net.WebSockets.ClientWebSocket]::new()
            $ws.ConnectAsync([Uri]$pagina.webSocketDebuggerUrl, $fine).GetAwaiter().GetResult()
            $domanda = @{ id = 1; method = 'Runtime.evaluate'; params = @{ expression = $js; awaitPromise = $true; returnByValue = $true; userGesture = $true } } | ConvertTo-Json -Depth 5 -Compress
            $ws.SendAsync([ArraySegment[byte]]::new([Text.Encoding]::UTF8.GetBytes($domanda)), [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $fine).GetAwaiter().GetResult()
            $pezzo = [byte[]]::new(65536)
            do {
              $testo = [Text.StringBuilder]::new()
              do {
                $r = $ws.ReceiveAsync([ArraySegment[byte]]::new($pezzo), $fine).GetAwaiter().GetResult()
                [void]$testo.Append([Text.Encoding]::UTF8.GetString($pezzo, 0, $r.Count))
              } until ($r.EndOfMessage)
              $risposta = $testo.ToString() | ConvertFrom-Json
            } until ($risposta.id -eq 1)
            "$($risposta.result.result.value)$($risposta.result.exceptionDetails.text)"
          }
          $srv = Start-Process -FilePath ./polaris-cli.exe -ArgumentList 'serve','--port','8741' -PassThru -NoNewWindow
          $edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          try {
            if (-not $edge) { throw "Microsoft Edge non trovato" }
            $nav = Start-Process -FilePath $edge -ArgumentList '--headless=new','--remote-debugging-port=9334','--remote-allow-origins=*',"--user-data-dir=$env:RUNNER_TEMP\edge-prova",'--no-first-run','http://127.0.0.1:8741/' -PassThru
            Start-Sleep 10
            "Narrazione in Microsoft Edge (stesso motore di WebView2): $(Suona 9334)"
          } catch { "Narrazione in Microsoft Edge: prova non riuscita ($_)" }
          if ($nav) { Stop-Process $nav -ErrorAction SilentlyContinue }
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          Stop-Process $srv -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaudo-windows
          path: |
            STARNET-Polaris/scan.json
            STARNET-Polaris/stato-pc.html
            STARNET-Polaris/finestra.png
          if-no-files-found: ignore
